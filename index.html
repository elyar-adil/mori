/* ---------- library: notebooks, tags, collapsible navigation ---------- */
const FOLDER_ICON = '<svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg>';
const TAG_ICON = '<svg viewBox="0 0 24 24"><path d="M10 4 8 20M16 4l-2 16M5 9h15M4 15h15"/></svg>';
const TAG_RE = /(^|[\s(（，。、；：,.;:!?！？"'“”])#([^\s#.,;:!?，。；：！？、()（）\[\]{}<>"'`“”‘’*~|\\/]{1,40})/g;

function noteTags(n) {
  const body = String(n.body || '').replace(/```[\s\S]*?```/g, ' ').replace(/`[^`\n]*`/g, ' ').replace(/\$\$[\s\S]*?\$\$/g, ' ');
  const out = new Set();
  TAG_RE.lastIndex = 0;
  let m;
  while ((m = TAG_RE.exec(body))) if (!/^\d+$/.test(m[2])) out.add(m[2]);
  return out;
}
function tagCounts() {
  const counts = new Map();
  activeNotes().forEach((n) => noteTags(n).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
  return Array.from(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));
}
function folderNames() {
  const set = new Set(state.folders);
  activeNotes().forEach((n) => { if (n.folder) set.add(n.folder); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'zh'));
}
const viewFolder = () => state.view.startsWith('folder:') ? state.view.slice(7) : null;
const viewTag = () => state.view.startsWith('tag:') ? state.view.slice(4) : null;

let navSignature = '';
function renderNav(force) {
  const folders = folderNames();
  const tags = tagCounts();
  const live = activeNotes();
  const sig = JSON.stringify([folders, tags, state.view, state.collapsedGroups, live.map((n) => n.folder || '')]);
  if (!force && sig === navSignature) return;
  navSignature = sig;
  const item = (view, icon, label, count, extra) =>
    '<button class="nav-item' + (state.view === view ? ' active' : '') + '" data-switch-view="' + escapeHtml(view) + '" title="' + escapeHtml(label) + '"' + (extra || '') + '>' +
      icon + '<span class="nav-label">' + escapeHtml(label) + '</span><span class="nav-count">' + (count || '') + '</span></button>';
  $('folder-list').innerHTML = folders.length
    ? folders.map((f) => item('folder:' + f, FOLDER_ICON, f, live.filter((n) => n.folder === f).length, ' data-folder="' + escapeHtml(f) + '"')).join('')
    : '<button type="button" class="nav-empty" data-add-folder>＋ 新建笔记本，把笔记分门别类</button>';
  $('tag-list').innerHTML = tags.length
    ? tags.map(([t, c]) => item('tag:' + t, TAG_ICON, t, c)).join('')
    : '<p class="nav-empty-text">在正文里写 <code>#标签</code>，这里会自动出现</p>';
  ['folders', 'tags'].forEach((g) => {
    const el = document.querySelector('.nav-group[data-group="' + g + '"]');
    const collapsed = !!state.collapsedGroups[g];
    el.classList.toggle('collapsed', collapsed);
    el.querySelector('[data-toggle-group]').setAttribute('aria-expanded', String(!collapsed));
  });
}

function switchView(view) {
  state.view = view;
  state.search = '';
  $('search').value = '';
  const list = filteredNotes();
  if (!list.some((n) => n.id === state.currentId)) {
    const first = list[0];
    if (first) openNote(first.id); else { state.currentId = null; renderAll(); }
  } else renderAll();
  closeSidebar();
  if (window.matchMedia('(max-width:760px)').matches) openNoteList();
}

function askName(title, initial, placeholder) {
  return new Promise((resolve) => {
    openModal('<section class="modal ask-modal" role="dialog" aria-modal="true" aria-label="' + escapeHtml(title) + '">' +
      '<header class="modal-head"><h2>' + escapeHtml(title) + '</h2></header>' +
      '<input class="field" id="ask-input" maxlength="40" autocomplete="off" spellcheck="false" placeholder="' + escapeHtml(placeholder || '') + '" value="' + escapeHtml(initial || '') + '">' +
      '<div class="modal-actions"><button type="button" class="btn ghost" data-close>取消</button><button type="button" class="btn primary" id="ask-ok">确定</button></div></section>');
    const input = $('ask-input');
    let done = false;
    const finish = (v) => { if (done) return; done = true; closeModal(); resolve(v); };
    $('ask-ok').addEventListener('click', () => { const v = input.value.trim(); if (v) finish(v); else input.focus(); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('ask-ok').click(); } });
    $('modal-root').querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => resolve(null)));
    $('modal-backdrop').addEventListener('mousedown', (e) => { if (e.target.id === 'modal-backdrop') resolve(null); });
    input.focus();
    input.select();
  });
}

async function createFolder(thenMoveNoteId) {
  const name = await askName('新建笔记本', '', '例如：工作、论文、读书笔记');
  if (!name) return null;
  if (!folderNames().includes(name)) { state.folders.push(name); savePrefs(); }
  if (thenMoveNoteId) moveNote(thenMoveNoteId, name);
  else switchView('folder:' + name);
  return name;
}

async function renameFolder(oldName) {
  const name = await askName('重命名笔记本', oldName);
  if (!name || name === oldName) return;
  if (folderNames().includes(name) && !confirm('已存在笔记本「' + name + '」，要合并进去吗？')) return;
  const now = Date.now();
  state.notes.forEach((n) => { if (n.folder === oldName) { n.folder = name; n.updatedAt = now; } });
  state.folders = Array.from(new Set(state.folders.map((f) => f === oldName ? name : f)));
  if (state.view === 'folder:' + oldName) state.view = 'folder:' + name;
  savePrefs(); saveLocal(); scheduleSync(); renderAll();
  toast('已重命名为「' + name + '」');
}

function deleteFolder(name) {
  const count = state.notes.filter((n) => n.folder === name).length;
  if (count && !confirm('删除笔记本「' + name + '」？其中 ' + count + ' 篇笔记会移回「所有笔记」，不会被删除。')) return;
  const now = Date.now();
  state.notes.forEach((n) => { if (n.folder === name) { n.folder = ''; n.updatedAt = now; } });
  state.folders = state.folders.filter((f) => f !== name);
  savePrefs(); saveLocal(); scheduleSync();
  if (state.view === 'folder:' + name) switchView('all'); else renderAll();
  toast('已删除笔记本');
}

function moveNote(id, folder) {
  const n = state.notes.find((x) => x.id === id);
  if (!n || (n.folder || '') === folder) return;
  n.folder = folder;
  n.updatedAt = Date.now();
  saveLocal(); scheduleSync();
  renderList(); renderChrome();
  toast(folder ? '已移到「' + folder + '」' : '已移出笔记本');
}

function openMoveDialog(id) {
  const n = state.notes.find((x) => x.id === id);
  if (!n) return;
  const current = n.folder || '';
  const row = (value, label, icon) => '<button class="menu-item' + (value === current ? ' current' : '') + '" data-move-to="' + escapeHtml(value) + '">' + icon + '<span>' + escapeHtml(label) + '</span>' + (value === current ? '<span class="menu-check">当前</span>' : '') + '</button>';
  openModal('<section class="modal menu" role="dialog" aria-modal="true" aria-label="移动到笔记本">' +
    '<div class="menu-title">移动「' + escapeHtml(n.title || '无标题') + '」到</div>' +
    row('', '不放入笔记本', '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>') +
    folderNames().map((f) => row(f, f, FOLDER_ICON)).join('') +
    '<button class="menu-item" id="move-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>新建笔记本…</span></button></section>');
  $('modal-root').querySelectorAll('[data-move-to]').forEach((b) => b.addEventListener('click', () => { closeModal(); moveNote(id, b.dataset.moveTo); }));
  $('move-new').addEventListener('click', () => { closeModal(); createFolder(id); });
}

function openMenuAt(x, y, title, items) {
  closeRowContextMenu();
  const left = Math.max(8, Math.min(x, window.innerWidth - 228));
  const top = Math.max(8, Math.min(y, window.innerHeight - (items.length * 34 + 50)));
  $('modal-root').innerHTML = '<div class="context-menu" id="row-context-menu" role="menu" style="left:' + left + 'px;top:' + top + 'px">' +
    (title ? '<div class="context-menu-title">' + escapeHtml(title) + '</div>' : '') +
    items.map((it, i) => it === '-' ? '<hr>' : '<button type="button" data-menu-i="' + i + '"' + (it[2] ? ' class="danger"' : '') + '>' + escapeHtml(it[0]) + '</button>').join('') + '</div>';
  const menu = $('row-context-menu');
  menu.querySelectorAll('[data-menu-i]').forEach((b) => b.addEventListener('click', () => { closeRowContextMenu(); items[Number(b.dataset.menuI)][1](); }));
  contextDismissHandler = (event) => { if (!menu.contains(event.target)) closeRowContextMenu(); };
  document.addEventListener('pointerdown', contextDismissHandler, true);
}

function setNavCollapsed(collapsed) {
  state.navCollapsed = collapsed;
  app.classList.toggle('nav-collapsed', collapsed);
  const t = $('nav-panel-toggle');
  const label = collapsed ? '显示侧栏' : '隐藏侧栏';
  t.setAttribute('aria-expanded', String(!collapsed));
  t.setAttribute('aria-label', label);
  t.title = label + ' (' + (/Mac|iPhone|iPad/i.test(navigator.platform || '') ? '⌘' : 'Ctrl+') + '\\)';
  savePrefs();
}

function bindLibrary() {
  const sidebar = $('sidebar');
  sidebar.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t || !sidebar.contains(t)) return;
    if (t.dataset.switchView) { switchView(t.dataset.switchView); return; }
    if (t.dataset.toggleGroup) {
      const g = t.dataset.toggleGroup;
      state.collapsedGroups[g] = !state.collapsedGroups[g];
      savePrefs(); renderNav(true);
      return;
    }
    if (t.hasAttribute('data-add-folder') || t.id === 'add-folder') { createFolder(); return; }
  });
  sidebar.addEventListener('contextmenu', (e) => {
    const f = e.target.closest('[data-folder]');
    if (!f) return;
    e.preventDefault();
    const name = f.dataset.folder;
    openMenuAt(e.clientX, e.clientY, name, [['重命名', () => renameFolder(name)], '-', ['删除笔记本', () => deleteFolder(name), true]]);
  });
  // long-press on touch devices opens the same folder menu
  let pressTimer = null;
  sidebar.addEventListener('touchstart', (e) => {
    const f = e.target.closest('[data-folder]');
    if (!f) return;
    const touch = e.touches[0];
    pressTimer = setTimeout(() => {
      pressTimer = null;
      const name = f.dataset.folder;
      openMenuAt(touch.clientX, touch.clientY, name, [['重命名', () => renameFolder(name)], '-', ['删除笔记本', () => deleteFolder(name), true]]);
    }, 550);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach((ev) => sidebar.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, { passive: true }));

  // drag a note from the list onto a notebook (or onto 所有笔记 to take it out)
  $('list').addEventListener('dragstart', (e) => {
    const row = e.target.closest('[data-id]');
    if (!row) return;
    e.dataTransfer.setData('text/x-mori-note', row.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    app.classList.add('dragging-note');
  });
  const endDrag = () => { app.classList.remove('dragging-note'); sidebar.querySelectorAll('.drop-target').forEach((x) => x.classList.remove('drop-target')); };
  // the dragged row is re-rendered on drop, so its dragend never reaches #list
  document.addEventListener('dragend', endDrag);
  document.addEventListener('drop', () => setTimeout(endDrag, 0));
  const dropTarget = (e) => e.target.closest('[data-folder],[data-switch-view="all"]');
  sidebar.addEventListener('dragover', (e) => {
    const t = dropTarget(e);
    if (!t || !e.dataTransfer.types.includes('text/x-mori-note')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    sidebar.querySelectorAll('.drop-target').forEach((x) => x.classList.toggle('drop-target', x === t));
  });
  sidebar.addEventListener('dragleave', (e) => { const t = dropTarget(e); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop-target'); });
  sidebar.addEventListener('drop', (e) => {
    const t = dropTarget(e);
    const id = e.dataTransfer.getData('text/x-mori-note');
    if (!t || !id) return;
    e.preventDefault();
    t.classList.remove('drop-target');
    moveNote(id, t.dataset.folder || '');
  });

  $('nav-panel-toggle').addEventListener('click', () => setNavCollapsed(!state.navCollapsed));
}

/* Home-screen (standalone) web apps on iOS with a translucent status bar report
   a viewport that is one status-bar height shorter than the screen, so a black
   strip shows below the page. Measure the gap and let the shell reach past it. */
function fixStandaloneViewport() {
  const root = document.documentElement;
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  root.classList.toggle('standalone', !!standalone);
  if (!standalone) { root.style.removeProperty('--viewport-gap'); return; }
  const portrait = innerHeight >= innerWidth;
  const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const gap = Math.max(0, Math.min(80, Math.round(full - innerHeight)));
  root.style.setProperty('--viewport-gap', gap + 'px');
}

/* ---------- dark mode ---------- */
/* iOS Safari ignores hsl() with space syntax in theme-color and paints the
   notch area black, so push the resolved rgb() of the editor surface there. */
function syncThemeColor() {
  const paper = getComputedStyle(document.body).getPropertyValue('--paper').trim();
  const probe = document.createElement('span');
  probe.style.color = paper;
  document.body.appendChild(probe);
  const rgb = getComputedStyle(probe).color;
  probe.remove();
  // The canvas behind Safari's translucent bottom bar shows <html>'s background;
  // match the editor surface so no darker band appears below the page.
  document.documentElement.style.setProperty('--page-bg', rgb);
  document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => meta.setAttribute('content', rgb));
}
function applyDark() {
  document.body.classList.toggle('dark', state.dark);
  syncThemeColor();
  document.documentElement.style.colorScheme = state.dark ? 'dark' : 'light';
}

/* ---------- GitHub sync ---------- */
function repoPath() { return state.repo.split('/').map(encodeURIComponent).join('/'); }
function filePath(p) { return p.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }

async function githubRequest(path, opts) {
  const o = opts || {};
  const token = await getToken();
  if (!token) throw new Error('请先在设置中连接 GitHub。');
  const res = await fetch('https://api.github.com' + path, {
    method: o.method || 'GET',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: 'Bearer ' + token,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(o.body ? { 'Content-Type': 'application/json' } : {})
    },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (res.status === 204) return {};
  let payload = null;
  const text = await res.text();
  try { payload = text ? JSON.parse(text) : {}; } catch (e) { payload = { message: text }; }
  if (!res.ok) {
    const err = new Error((payload && payload.message) || 'GitHub API 错误 ' + res.status);
    err.status = res.status;
    throw err;
  }
  return payload;
}

function encodeBase64Utf8(s) {
  const bytes = new TextEncoder().encode(s);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function decodeBase64Utf8(s) {
  const binary = atob(String(s || '').replace(/\s/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function noteFileContent(n) {
  const meta = {
    id: n.id,
    title: n.title || '',
    tags: n.tags || [],
    createdAt: n.createdAt || Date.now(),
    updatedAt: n.updatedAt || Date.now(),
    favorite: !!n.favorite,
    pinned: !!n.pinned,
    deletedAt: n.deletedAt || null,
    folder: n.folder || ''
  };
  return '<!-- MORI_NOTE\n' + JSON.stringify(meta) + '\n-->\n' + (n.body || '') + '\n';
}

function parseNoteFile(raw, filename) {
  const m = raw.match(/^<!-- MORI_NOTE\s*\n([\s\S]*?)\n-->\s*\n?/);
  if (m) {
    try {
      const meta = JSON.parse(m[1]);
      let body = raw.slice(m[0].length);
      if (body.endsWith('\n')) body = body.slice(0, -1);
      return {
        ...meta,
        id: meta.id || filename.replace(/\.md$/, ''),
        body,
        tags: Array.isArray(meta.tags) ? meta.tags : [],
        title: meta.title || '',
        createdAt: meta.createdAt || Date.now(),
        updatedAt: meta.updatedAt || Date.now(),
        favorite: !!meta.favorite,
        pinned: !!meta.pinned,
        deletedAt: meta.deletedAt || null,
        folder: typeof meta.folder === 'string' ? meta.folder : ''
      };
    } catch (e) { /* fall through */ }
  }
  let title = filename.replace(/\.md$/, '');
  let body = raw;
  const h = raw.match(/^#\s+(.+)\n/);
  if (h) { title = h[1].trim(); body = raw.slice(h[0].length); }
  if (body.endsWith('\n')) body = body.slice(0, -1);
  return { id: filename.replace(/\.md$/, ''), title, body, tags: [], createdAt: Date.now(), updatedAt: Date.now(), favorite: false, pinned: false, deletedAt: null, folder: '' };
}

async function listRemoteFiles() {
  const path = '/repos/' + repoPath() + '/contents/' + filePath(state.dir);
  let listing;
  try {
    listing = await githubRequest(path);
  } catch (e) {
    if (e.status === 404) return [];
    throw e;
  }
  if (!Array.isArray(listing)) throw new Error('笔记目录不是文件夹，请检查同步目录设置。');
  return listing.filter((x) => x.type === 'file' && x.name.endsWith('.md'));
}

function remoteFilePath(id) {
  return (state.dir.replace(/^\/+|\/+$/g, '') + '/' + id + '.md').split('/').filter(Boolean).join('/');
}

async function putRemoteNote(n, sha) {
  const body = { message: 'Mori: ' + (sha ? 'update' : 'add') + ' note — ' + (n.title || 'untitled').slice(0, 50), content: encodeBase64Utf8(noteFileContent(n)) };
  if (sha) body.sha = sha;
  return githubRequest('/repos/' + repoPath() + '/contents/' + filePath(remoteFilePath(n.id)), { method: 'PUT', body });
}

function sameNote(a, b) {
  return !!a && !!b && a.title === b.title && a.body === b.body && !!a.favorite === !!b.favorite &&
    !!a.pinned === !!b.pinned && (a.deletedAt || null) === (b.deletedAt || null) && (a.folder || '') === (b.folder || '');
}

/* Incremental sync: the directory listing carries every file's blob sha, so only
   files that changed since the last run are downloaded, and only notes edited
   since the last run are uploaded. Permanent deletions are propagated. */
async function syncNow(silent) {
  if (state.syncBusy) return;
  const token = await getToken();
  if (!token) {
    if (!silent) { openSettings(); toast('先连接 GitHub 私有仓库'); }
    return;
  }
  clearTimeout(syncTimer);
  state.syncBusy = true;
  state.syncError = '';
  state.lastSyncAt = Date.now();
  renderChrome();
  if (!silent) toast('正在同步…');
  const meta = state.syncMeta;
  let changed = false, currentChanged = false, retry = false;

  const push = async (note, sha) => {
    const stamp = note.updatedAt || 0;
    try {
      const res = await putRemoteNote(note, sha);
      meta.shas[note.id] = res && res.content ? res.content.sha : '';
      meta.stamps[note.id] = stamp;
    } catch (e) {
      if (e.status === 409 || e.status === 422) { delete meta.shas[note.id]; retry = true; return; }
      throw e;
    }
  };

  try {
    const repoInfo = await githubRequest('/repos/' + repoPath());
    if (!repoInfo.private) throw new Error('请连接私有仓库，避免笔记被公开。');
    const files = await listRemoteFiles();
    const remoteFiles = new Map(files.map((f) => [f.name.replace(/\.md$/, ''), f]));

    // 1. permanent deletions made on this device
    for (const id of meta.deleted.slice()) {
      const f = remoteFiles.get(id);
      if (f) {
        try {
          await githubRequest('/repos/' + repoPath() + '/contents/' + filePath(f.path), { method: 'DELETE', body: { message: 'Mori: delete note', sha: f.sha } });
        } catch (e) {
          if (e.status === 409 || e.status === 422) { retry = true; continue; }
          if (e.status !== 404) throw e;
        }
      }
      remoteFiles.delete(id);
      delete meta.shas[id];
      delete meta.stamps[id];
      meta.deleted = meta.deleted.filter((x) => x !== id);
    }

    // 2. files that exist remotely
    for (const [id, f] of remoteFiles) {
      const local = state.notes.find((n) => n.id === id);
      if (local && meta.shas[id] === f.sha) {
        if ((local.updatedAt || 0) > (meta.stamps[id] || 0)) await push(local, f.sha);
        continue;
      }
      const data = await githubRequest('/repos/' + repoPath() + '/contents/' + filePath(f.path));
      const remote = parseNoteFile(decodeBase64Utf8(data.content), f.name);
      remote.id = id;
      if (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0)) {
        if (!sameNote(local, remote)) {
          const ix = local ? state.notes.indexOf(local) : -1;
          if (ix >= 0) state.notes[ix] = remote; else state.notes.push(remote);
          changed = true;
          if (id === state.currentId) currentChanged = true;
        } else if (local) {
          local.updatedAt = remote.updatedAt;
        }
        meta.shas[id] = data.sha;
        meta.stamps[id] = remote.updatedAt || 0;
      } else {
        await push(local, data.sha);
      }
    }

    // 3. notes that are not in the remote folder
    for (const l of state.notes.slice()) {
      if (remoteFiles.has(l.id)) continue;
      const wasSynced = meta.stamps[l.id] != null;
      if (wasSynced && files.length && (l.updatedAt || 0) <= meta.stamps[l.id]) {
        // deleted on another device and untouched here since
        state.notes = state.notes.filter((n) => n !== l);
        delete meta.stamps[l.id];
        delete meta.shas[l.id];
        changed = true;
        if (l.id === state.currentId) currentChanged = true;
        continue;
      }
      await push(l, null);
    }

    state.lastSynced = Date.now();
    saveSyncMeta();
    if (changed) {
      saveLocal();
      if (currentChanged) {
        if (!currentNote()) {
          const next = filteredNotes()[0];
          state.currentId = next ? next.id : null;
          renderAll();
        } else {
          renderList();
          const cur = currentNote();
          titleEl.value = cur.title || '';
          growTitle();
          renderDoc({ caret: Math.min(lastCaret, (cur.body || '').length), focus: false });
        }
      } else {
        renderList();
      }
    }
    updateStatusMeta();
    if (!silent) toast('已同步');
  } catch (e) {
    saveSyncMeta();
    state.syncError = e.message || String(e);
    if (!silent) toast('同步失败：' + state.syncError);
  } finally {
    state.syncBusy = false;
    renderChrome();
    if (retry && (state.syncRetries = (state.syncRetries || 0) + 1) <= 3) scheduleSync();
    else if (!retry) state.syncRetries = 0;
  }
}

function syncIntervalMs() {
  return state.syncInterval > 0 ? state.syncInterval * 60000 : 0;
}

/* Edits are batched: at most one push per interval (each push is a commit). */
function scheduleSync() {
  if (!state.connected) return;
  clearTimeout(syncTimer);
  if (state.syncInterval === -1) return;
  const wait = state.syncInterval === 0 ? 2600 : Math.max(2600, state.lastSyncAt + syncIntervalMs() - Date.now());
  syncTimer = setTimeout(() => syncNow(true), wait);
}

/* Periodic pull so edits from other devices arrive even when idle here. */
function syncTick() {
  if (!state.connected || state.syncBusy || state.syncInterval === -1 || document.visibilityState !== 'visible') return;
  const every = syncIntervalMs() || 5 * 60000;
  if (Date.now() - state.lastSyncAt >= every) syncNow(true);
}

/* Best-effort push when the page is hidden or closed. Uses keepalive requests
   against the shas we already know; anything that fails is retried by the next
   full sync. */
function flushSync() {
  if (!state.connected || !state.token || state.syncInterval === -1 || state.syncBusy) return;
  const meta = state.syncMeta;
  const dirty = state.notes.filter((n) => meta.stamps[n.id] == null || (n.updatedAt || 0) > meta.stamps[n.id]);
  let budget = 60000;
  for (const n of dirty) {
    const sha = meta.shas[n.id];
    if (meta.stamps[n.id] != null && !sha) continue;
    const payload = { message: 'Mori: ' + (sha ? 'update' : 'add') + ' note — ' + (n.title || 'untitled').slice(0, 50), content: encodeBase64Utf8(noteFileContent(n)) };
    if (sha) payload.sha = sha;
    const body = JSON.stringify(payload);
    if (body.length > budget) continue;
    budget -= body.length;
    const stamp = n.updatedAt || 0;
    fetch('https://api.github.com/repos/' + repoPath() + '/contents/' + filePath(remoteFilePath(n.id)), {
      method: 'PUT', keepalive: true, body,
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + state.token, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' }
    }).then((r) => r.ok ? r.json() : null).then((res) => {
      if (res && res.content) { meta.shas[n.id] = res.content.sha; meta.stamps[n.id] = stamp; saveSyncMeta(); updateStatusMeta(); }
    }).catch(() => {});
  }
}

/* ---------- encrypted token vault ---------- */
let vaultPromise;
function vaultDb() {
  if (vaultPromise) return vaultPromise;
  vaultPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('mori-secure-vault', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('vault')) db.createObjectStore('vault');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return vaultPromise;
}

async function vaultGet(key) {
  const db = await vaultDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('vault', 'readonly');
    const r = tx.objectStore('vault').get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

async function vaultSet(key, value) {
  const db = await vaultDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('vault', 'readwrite');
    tx.objectStore('vault').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function vaultDelete(key) {
  try {
    const db = await vaultDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('vault', 'readwrite');
      tx.objectStore('vault').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* ignore */ }
}

async function saveVaultToken(token) {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  await vaultSet('token-key', key);
  await vaultSet('token-cipher', { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) });
}

async function loadVaultToken() {
  try {
    const stored = await vaultGet('token-cipher');
    const key = await vaultGet('token-key');
    if (!stored || !key) return '';
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(stored.iv) }, key, new Uint8Array(stored.data));
    return new TextDecoder().decode(plain);
  } catch (e) {
    return '';
  }
}

async function getToken() {
  if (state.token) return state.token;
  const s = sessionStorage.getItem(SESSION_KEY);
  if (s) { state.token = s; state.connected = true; return s; }
  const v = await loadVaultToken();
  if (v) { state.token = v; state.connected = true; }
  return v;
}

async function saveConnection() {
  const repo = $('repo-field').value.trim();
  const dir = $('dir-field').value.trim().replace(/^\/+|\/+$/g, '') || 'mori-notes';
  const typed = $('token-field').value.trim();
  const remember = $('remember-token').checked;
  const status = $('settings-status');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    status.className = 'modal-status err';
    status.textContent = '仓库格式应为 owner/repo。';
    return;
  }
  state.repo = repo;
  state.dir = dir;
  state.syncMeta = loadSyncMeta();
  state.tokenMode = remember ? 'device' : 'session';
  try {
    if (typed) {
      state.token = typed;
      state.connected = true;
      if (remember) {
        sessionStorage.removeItem(SESSION_KEY);
        await saveVaultToken(typed);
      } else {
        sessionStorage.setItem(SESSION_KEY, typed);
        await vaultDelete('token-cipher');
        await vaultDelete('token-key');
      }
    } else {
      const t = await getToken();
      state.connected = !!t;
    }
    savePrefs();
    saveLocal();
    if (!state.connected) {
      status.className = 'modal-status';
      status.textContent = '设置已保存。输入令牌后即可连接。';
      return;
    }
    status.className = 'modal-status';
    status.textContent = '正在验证…';
    const meta = await githubRequest('/repos/' + repoPath());
    if (!meta.private) throw new Error('仓库必须是私有的，避免笔记被公开。');
    status.className = 'modal-status ok';
    status.textContent = '连接成功。';
    updateStatusMeta();
    setTimeout(() => { if ($('modal-root').innerHTML) closeModal(); }, 700);
    setTimeout(() => syncNow(true), 500);
  } catch (e) {
    state.syncError = e.message || String(e);
    status.className = 'modal-status err';
    status.textContent = '连接失败：' + state.syncError;
    updateStatusMeta();
  }
}

async function forgetToken() {
  if (!confirm('忘记此设备保存的 GitHub 令牌？这不会删除远端笔记。')) return;
  state.token = '';
  state.connected = false;
  sessionStorage.removeItem(SESSION_KEY);
  await vaultDelete('token-cipher');
  await vaultDelete('token-key');
  const f = $('token-field');
  if (f) f.value = '';
  const status = $('settings-status');
  if (status) { status.className = 'modal-status'; status.textContent = '令牌已移除，远端笔记未受影响。'; }
  updateStatusMeta();
  toast('已忘记令牌');
}

/* ---------- bind ---------- */
function deleteImageBlock(block) {
  const note = currentNote();
  if (!note || !block || !block.classList.contains('image-block')) return;
  const index = Number(block.dataset.i);
  const parsed = splitBlocks(note.body || '')[index];
  if (!parsed || parsed.type !== 'image') return;
  const md = note.body || '';
  let start = parsed.start;
  let end = parsed.start + parsed.raw.length;
  if (md[end] === '\n') end++;
  else if (start > 0 && md[start - 1] === '\n') start--;
  applyBody(md.slice(0,start) + md.slice(end), Math.min(start,md.length), true);
  toast('图片已删除');
}

function readTableWidget(table) {
  const rows = [];
  const header = table.querySelector('thead tr');
  if (header) rows.push(Array.from(header.querySelectorAll('.table-cell-input')).map((input) => input.value));
  table.querySelectorAll('tbody tr').forEach((tr) => {
    rows.push(Array.from(tr.querySelectorAll('.table-cell-input')).map((input) => input.value));
  });
  const columns = Math.max(1, ...rows.map((row) => row.length));
  rows.forEach((row) => { while (row.length < columns) row.push(''); });
  const original = parseMarkdownTable(table.dataset.raw || '');
  const align = original.align.slice(0,columns);
  while (align.length < columns) align.push('left');
  return { rows, align };
}

function refreshTableControlState(table) {
  const removeRow = table.querySelector('[data-table-action="remove-row"]');
  const removeCol = table.querySelector('[data-table-action="remove-col"]');
  const alignBtn = table.querySelector('[data-table-action="align"]');
  const rows = table.querySelectorAll('thead tr,tbody tr').length;
  const columns = table.querySelectorAll('thead th').length;
  const activeRow = Number(table.dataset.activeRow || 0);
  const activeCol = Number(table.dataset.activeCol || 0);
  if (removeRow) { removeRow.disabled = rows <= 2 || activeRow === 0; removeRow.title = activeRow === 0 ? '表头不能删除' : '删除当前行'; }
  if (removeCol) removeCol.disabled = columns <= 1;
  if (alignBtn) {
    const align = parseMarkdownTable(table.dataset.raw || '').align[activeCol] || 'left';
    alignBtn.querySelector('svg').innerHTML = TABLE_ALIGN_ICONS[align];
    alignBtn.title = '当前列：' + TABLE_ALIGN_LABEL[align] + '（点击切换）';
  }
}

function updateTableSource(table, model, focusCell, structural) {
  const note = currentNote();
  if (!note || !table || !table.isConnected) return;
  const index = Number(table.dataset.i);
  const blocks = splitBlocks(note.body || '');
  const block = blocks[index];
  if (!block || block.type !== 'table') return;
  const raw = serializeMarkdownTable(model);
  const body = note.body || '';
  const next = body.slice(0,block.start) + raw + body.slice(block.start + block.raw.length);
  if (next === body) return;
  const caret = block.start + raw.length;
  applyBody(next, caret, structural !== false);
  const updated = editor.querySelector('.table-widget[data-i="'+index+'"]');
  if (updated && focusCell) {
    const input = updated.querySelector('.table-cell-input[data-row="'+focusCell.row+'"][data-col="'+focusCell.col+'"]');
    if (input) {
      input.focus({preventScroll:true});
      input.setSelectionRange(input.value.length,input.value.length);
      updated.dataset.activeRow = String(focusCell.row);
      updated.dataset.activeCol = String(focusCell.col);
      refreshTableControlState(updated);
    }
  }
}

function commitTableCellInput(table, structural) {
  const note = currentNote();
  if (!note || !table || !table.isConnected) return;
  const model = readTableWidget(table);
  const raw = serializeMarkdownTable(model);
  const index = Number(table.dataset.i);
  const block = splitBlocks(note.body || '')[index];
  if (!block || block.type !== 'table') return;
  const body = note.body || '';
  if (raw === block.raw) return;
  note.body = body.slice(0,block.start) + raw + body.slice(block.start + block.raw.length);
  table.dataset.raw = raw;
  note.updatedAt = Date.now();
  histPush(note, block.start, !!structural);
  saveSoon();
  updateListItem();
  updateStatusMeta();
}

function moveTableFocus(table, row, col, caret) {
  const rows = table.querySelectorAll('thead tr,tbody tr');
  const maxRow = rows.length - 1;
  const maxCol = Math.max(0, table.querySelectorAll('thead th').length - 1);
  row = Math.max(0,Math.min(maxRow,row));
  col = Math.max(0,Math.min(maxCol,col));
  const input = table.querySelector('.table-cell-input[data-row="'+row+'"][data-col="'+col+'"]');
  if (input) {
    input.focus();
    const at = caret === 'start' ? 0 : input.value.length;
    if (caret) input.setSelectionRange(at, at); else input.select();
    table.dataset.activeRow = String(row);
    table.dataset.activeCol = String(col);
    refreshTableControlState(table);
  }
}

function tableBlockOf(table) {
  const note = currentNote();
  if (!note || !table) return null;
  const block = splitBlocks(note.body || '')[Number(table.dataset.i)];
  return block && block.type === 'table' ? block : null;
}

/* Leave the table with the keyboard; make sure there is a line to land on. */
function exitTable(table, dir) {
  const note = currentNote();
  const block = tableBlockOf(table);
  if (!note || !block) return;
  let body = note.body || '';
  editor.focus({ preventScroll: true });
  if (dir > 0) {
    const end = block.start + block.raw.length;
    if (end >= body.length) body += '\n';
    applyBody(body, end + 1, body !== note.body);
  } else if (block.start === 0) {
    applyBody('\n' + body, 0, true);
  } else {
    applyBody(body, block.start - 1, false);
  }
  ensureCaretVisible();
}

function handleTableAction(button) {
  const table = button.closest('.table-widget');
  if (!table) return;
  const action = button.dataset.tableAction;
  if (action === 'delete-table') {
    const note = currentNote(), block = tableBlockOf(table);
    if (!note || !block) return;
    const body = note.body || '';
    let end = block.start + block.raw.length;
    if (body[end] === '\n') end++;
    editor.focus({ preventScroll: true });
    applyBody(body.slice(0, block.start) + body.slice(end), block.start, true);
    toast('已删除表格，可用 ⌘Z 撤销');
    return;
  }
  const model = readTableWidget(table);
  const width = model.rows[0].length;
  let row = clamp(Number(table.dataset.activeRow || 0), 0, model.rows.length - 1);
  let col = clamp(Number(table.dataset.activeCol || 0), 0, width - 1);
  if (action === 'add-row') {
    model.rows.splice(row + 1, 0, Array(width).fill(''));
    row += 1;
  } else if (action === 'append-row') {
    model.rows.push(Array(width).fill(''));
    row = model.rows.length - 1; col = 0;
  } else if (action === 'remove-row') {
    if (model.rows.length <= 2 || row === 0) return;
    model.rows.splice(row, 1);
    row = Math.min(row, model.rows.length - 1);
  } else if (action === 'add-col') {
    model.rows.forEach((cells) => cells.splice(col + 1, 0, ''));
    model.align.splice(col + 1, 0, 'left');
    col += 1; row = 0;
  } else if (action === 'append-col') {
    model.rows.forEach((cells) => cells.push(''));
    model.align.push('left');
    col = model.align.length - 1; row = 0;
  } else if (action === 'remove-col') {
    if (width <= 1) return;
    model.rows.forEach((cells) => cells.splice(col, 1));
    model.align.splice(col, 1);
    col = Math.min(col, model.align.length - 1);
  } else if (action === 'align') {
    const order = ['left', 'center', 'right'];
    model.align[col] = order[(order.indexOf(model.align[col] || 'left') + 1) % 3];
  } else return;
  updateTableSource(table, model, { row, col }, true);
}

function insertTable() {
  const note = currentNote();
  if (!note) return;
  const md = note.body || '', sel = selectionOffsets();
  const start = sel ? sel.start : (caretOffset() == null ? md.length : caretOffset());
  const end = sel ? sel.end : start;
  const before = md.slice(0, start), after = md.slice(end);
  const lead = before && !before.endsWith('\n') ? '\n\n' : '';
  const template = '| 标题 1 | 标题 2 |\n| :--- | :--- |\n|  |  |';
  const tail = after.startsWith('\n') ? '' : after ? '\n\n' : '\n';   // always leave a line after the table
  const tableStart = before.length + lead.length;
  editor.focus({ preventScroll: true });
  applyBody(before + lead + template + tail + after, tableStart + template.length + 1, true);
  const index = blockIndexAt(splitBlocks(currentNote().body || ''), tableStart);
  const widget = editor.querySelector('.table-widget[data-i="' + index + '"]');
  const input = widget && widget.querySelector('.table-cell-input[data-row="0"][data-col="0"]');
  if (input) { input.focus(); input.select(); }
}

const inTableCell = (e) => !!(e.target && e.target.closest && e.target.closest('.table-widget'));

function bind() {
  $('new-btn').addEventListener('click', createNote);
  $('empty-new').addEventListener('click', createNote);
  $('settings-btn').addEventListener('click', openSettings);
  $('theme-btn').addEventListener('click', () => { state.dark = !state.dark; applyDark(); savePrefs(); });
  $('sync-btn').addEventListener('click', () => syncNow(false));
  $('star-btn').addEventListener('click', toggleFavorite);
  $('more-btn').addEventListener('click', openNoteMenu);
  $('nav-btn').addEventListener('click', () => { if(app.classList.contains('sidebar-open')) closeSidebar(); else { closeNoteList(); openSidebar(); } });
  $('back-btn').addEventListener('click', () => { if(app.classList.contains('list-open')) closeNoteList(); else { closeSidebar(); openNoteList(); } });
  $('overlay').addEventListener('click', closeDrawers);
  bindLibrary();
  bindToolbar();
  $('trash-btn').addEventListener('click', () => {
    state.view = state.view === 'trash' ? 'all' : 'trash';
    state.search = '';
    $('search').value = '';
    const list = filteredNotes();
    if (!list.some((n) => n.id === state.currentId)) {
      const first = list[0];
      if (first) openNote(first.id); else { state.currentId = null; renderAll(); }
    } else {
      renderList();
      renderChrome();
    }
  });
  $('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    renderList();
    renderChrome();
  });
  $('search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = filteredNotes()[0];
      if (first) { e.preventDefault(); openNote(first.id, true); }
    } else if (e.key === 'Escape') {
      e.target.value = '';
      state.search = '';
      renderList();
      renderChrome();
      e.target.blur();
    }
  });
  $('import-file').addEventListener('change', (e) => {
    importFile(e.target.files && e.target.files[0]);
    e.target.value = '';
  });
  $('image-file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    const bookmark = pendingImageBookmark;
    pendingImageBookmark = null;
    if (file) insertImageFile(file, bookmark);
  });

  titleEl.addEventListener('input', () => {
    const n = currentNote();
    if (!n) return;
    n.title = titleEl.value;
    n.updatedAt = Date.now();
    growTitle();
    saveSoon();
    updateListItem();
  });
  titleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); focusEditor(); setCaret(0); }
  });

  editor.addEventListener('input', (e) => {
    const input = e.target.closest && e.target.closest('.table-cell-input');
    if (!input) return;
    e.stopImmediatePropagation();
    const table = input.closest('.table-widget');
    if (!table) return;
    table.dataset.activeRow = input.dataset.row;
    table.dataset.activeCol = input.dataset.col;
    commitTableCellInput(table,false);
    refreshTableControlState(table);
  }, true);
  editor.addEventListener('focusin', (e) => {
    const input = e.target.closest && e.target.closest('.table-cell-input');
    if (!input) return;
    const table = input.closest('.table-widget');
    if (!table) return;
    table.dataset.activeRow = input.dataset.row;
    table.dataset.activeCol = input.dataset.col;
    refreshTableControlState(table);
    table.querySelectorAll('.table-cell-input').forEach((cell) => cell.closest('th,td').classList.toggle('is-current',cell===input));
  });
  editor.addEventListener('click', (e) => {
    const button = e.target.closest && e.target.closest('[data-table-action]');
    if (!button) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    handleTableAction(button);
  }, true);
  editor.addEventListener('keydown', (e) => {
    const input = e.target.closest && e.target.closest('.table-cell-input');
    if (!input) return;
    const table = input.closest('.table-widget');
    if (!table) return;
    e.stopImmediatePropagation();
    if (e.isComposing || e.keyCode === 229) return;
    const row = Number(input.dataset.row), col = Number(input.dataset.col);
    const lastRow = table.querySelectorAll('thead tr,tbody tr').length - 1;
    const lastCol = table.querySelectorAll('thead th').length - 1;
    const atStart = input.selectionStart === 0 && input.selectionEnd === 0;
    const atEnd = input.selectionStart === input.value.length && input.selectionEnd === input.value.length;
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        if (col > 0) moveTableFocus(table, row, col - 1);
        else if (row > 0) moveTableFocus(table, row - 1, lastCol);
      } else if (col < lastCol) moveTableFocus(table, row, col + 1);
      else if (row < lastRow) moveTableFocus(table, row + 1, 0);
      else {
        const model = readTableWidget(table);
        model.rows.push(Array(model.rows[0].length).fill(''));
        updateTableSource(table, model, { row: row + 1, col: 0 }, true);
      }
    } else if (e.key === 'Enter' && !mod) {
      e.preventDefault();
      if (e.shiftKey) { if (row > 0) moveTableFocus(table, row - 1, col); }
      else if (row < lastRow) moveTableFocus(table, row + 1, col);
      else {
        const model = readTableWidget(table);
        model.rows.push(Array(model.rows[0].length).fill(''));
        updateTableSource(table, model, { row: row + 1, col }, true);
      }
    } else if (e.key === 'Enter' && mod) {
      e.preventDefault(); exitTable(table, 1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (row < lastRow) moveTableFocus(table, row + 1, col); else exitTable(table, 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (row > 0) moveTableFocus(table, row - 1, col); else exitTable(table, -1);
    } else if (e.key === 'ArrowLeft' && atStart && !e.shiftKey && col > 0) {
      e.preventDefault(); moveTableFocus(table, row, col - 1, 'end');
    } else if (e.key === 'ArrowRight' && atEnd && !e.shiftKey && col < lastCol) {
      e.preventDefault(); moveTableFocus(table, row, col + 1, 'start');
    } else if (e.key === 'Escape') {
      e.preventDefault(); exitTable(table, 1);
    } else if (mod && e.key.toLowerCase() === 's') {
      e.preventDefault(); syncNow(false);
    }
  }, true);
  editor.addEventListener('mousedown', (e) => {
    // keep focus in the current cell so the floating tools don't vanish mid-click
    if (e.target.closest && e.target.closest('[data-table-action],.taskbox,[data-code-lang],[data-code-copy]')) e.preventDefault();
  }, true);
  editor.addEventListener('input', (e) => {
    if (composing || inTableCell(e)) return;
    syncFromDom();
  });

  editor.addEventListener('compositionstart', (e) => {
    if (inTableCell(e)) return;
    composing = true;
  });
  editor.addEventListener('compositionend', (e) => {
    if (inTableCell(e)) return;
    composing = false;
    syncFromDom();
  });

  editor.addEventListener('beforeinput', (e) => {
    if (inTableCell(e)) return;
    const t = e.inputType;
    if (t === 'insertText' && !composing && typeof e.data === 'string' && e.data) {
      e.preventDefault();
      insertTextAt(e.data, false);
      return;
    }
    if (t === 'insertParagraph' || t === 'insertLineBreak') {
      e.preventDefault();
      handleEnter();
      return;
    }
    if (t === 'insertFromPaste' || t === 'insertFromDrop') {
      e.preventDefault();
      return;
    }
    if (t === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (t === 'historyRedo') { e.preventDefault(); redo(); return; }
    if (t === 'formatBold') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (t === 'formatItalic') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (t === 'deleteContentBackward') {
      if (handleBackspace()) e.preventDefault();
      return;
    }
    if (t === 'deleteContentForward') {
      if (handleDelete()) e.preventDefault();
      return;
    }
    if (t === 'deleteByCut') {
      const sel = selectionOffsets();
      if (sel && sel.start !== sel.end) {
        const note = currentNote();
        const text = (note.body || '').slice(sel.start, sel.end);
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        e.preventDefault();
        deleteRange(sel.start, sel.end);
      }
    }
  });

  editor.addEventListener('paste', (e) => {
    if (inTableCell(e)) return;
    const clipboard = e.clipboardData;
    const imageItem = clipboard && Array.from(clipboard.items || []).find((item) => item.kind === 'file' && item.type.startsWith('image/'));
    if (imageItem) {
      const file = imageItem.getAsFile();
      if (file) {
        e.preventDefault();
        insertImageFile(file, captureImageBookmark());
        return;
      }
    }
    const text = clipboard ? clipboard.getData('text/plain') : '';
    if (!text) return;
    e.preventDefault();
    insertTextAt(text.replace(/\r\n?/g, '\n'), true);
  });

  editor.addEventListener('click', (e) => {
    const langBtn = e.target.closest && e.target.closest('[data-code-lang]');
    if (langBtn) { e.preventDefault(); openCodeLangMenu(langBtn.closest('.blk'), langBtn); return; }
    const copyBtn = e.target.closest && e.target.closest('[data-code-copy]');
    if (copyBtn) { e.preventDefault(); copyCodeBlock(copyBtn.closest('.blk')); return; }
    const imageDelete = e.target.closest && e.target.closest('[data-delete-image]');
    if (imageDelete) {
      e.preventDefault();
      e.stopPropagation();
      deleteImageBlock(imageDelete.closest('.image-block'));
      return;
    }
    const imageBlock = e.target.closest && e.target.closest('.image-block');
    if (imageBlock) {
      editor.querySelectorAll('.image-block.is-selected').forEach((el) => el.classList.remove('is-selected'));
      imageBlock.classList.add('is-selected');
      imageBlock.focus({preventScroll:true});
      return;
    }
    const mathBlock=e.target.closest&&e.target.closest('.math-block');
    if(mathBlock){
      e.preventDefault();
      const note=currentNote(),block=splitBlocks(note?note.body||'':'')[Number(mathBlock.dataset.i)];
      if(block&&block.type==='math')openMathEditor({mode:'edit',noteId:note.id,start:block.start,raw:block.raw});
      return;
    }
    const box = e.target.closest && e.target.closest('.taskbox');
    if (box) {
      e.preventDefault();
      toggleTask(Number(box.dataset.task));
      return;
    }
    const tagEl = e.target.closest && e.target.closest('.tag[data-tag]');
    if (tagEl && (e.metaKey || e.ctrlKey)) { e.preventDefault(); switchView('tag:' + tagEl.dataset.tag); return; }
    const link = e.target.closest && e.target.closest('a');
    if (link) {
      if (e.metaKey || e.ctrlKey) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
      else e.preventDefault();
    }
  });

  editor.addEventListener('keydown', (e) => {
    if (inTableCell(e)) return;
    const imageBlock = e.target.closest && e.target.closest('.image-block');
    if (imageBlock && (e.key === 'Backspace' || e.key === 'Delete')) {
      e.preventDefault();
      e.stopImmediatePropagation();
      deleteImageBlock(imageBlock);
      return;
    }
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Tab') {
      e.preventDefault();
      insertTextAt('  ', true);
      return;
    }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'i') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); wrapSelection('[', '](https://)'); return; }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); redo(); return; }
  });

  document.addEventListener('selectionchange', () => {
    if (composing) return;
    if (document.activeElement !== editor && !editor.contains(document.activeElement)) {
      updateToolbarState();
      return;
    }
    const off = caretOffset();
    if (off != null) lastCaret = off;
    updateActive();
  });
  editor.addEventListener('keyup', updateActive);
  editor.addEventListener('mouseup', updateActive);
  editor.addEventListener('focus', updateToolbarState);
  editor.addEventListener('blur', () => requestAnimationFrame(updateToolbarState));

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k' && !e.shiftKey) {
      e.preventDefault();
      if(window.matchMedia('(max-width:760px)').matches)openNoteList();
      $('search').focus();
      $('search').select();
      return;
    }
    if (mod && (e.key.toLowerCase() === 'n' || e.code === 'KeyN')) { e.preventDefault(); createNote(); return; }
    if (mod && e.key === '\\') { e.preventDefault(); setNavCollapsed(!state.navCollapsed); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); syncNow(false); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'f') {
      if (currentNote()) { e.preventDefault(); toggleFavorite(); }
      return;
    }
    if (e.key === 'Escape') {
      if ($('row-context-menu')) { closeRowContextMenu(); return; }
      if ($('modal-root').innerHTML) { closeModal(); return; }
      if (document.activeElement === $('search')) { $('search').blur(); return; }
      if (app.classList.contains('sidebar-open')) { closeSidebar(); return; }
      if (app.classList.contains('list-open')) { closeNoteList(); return; }
    }
  });

  window.addEventListener('beforeunload', () => { saveLocal(); });
  window.addEventListener('pagehide', () => { saveLocal(); flushSync(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { saveLocal(); flushSync(); }
    else syncTick();
  });
  setInterval(syncTick, 30000);
  window.addEventListener('resize', () => { growTitle(); });
}

/* ---------- boot ---------- */
function boot() {
  fixStandaloneViewport();
  window.addEventListener('resize', fixStandaloneViewport);
  window.addEventListener('orientationchange', () => setTimeout(fixStandaloneViewport, 300));
  loadLocal();
  applyTypography();
  setNavCollapsed(state.navCollapsed);
  if (!/Mac|iPhone|iPad/i.test(navigator.platform || navigator.userAgent || '')) $('search-kbd').textContent = 'Ctrl K';
  applyAnimal();
  applyDark();
  bind();
  const first = filteredNotes()[0];
  if (first) {
    state.currentId = first.id;
    histReset(first);
    titleEl.value = first.title || '';
    growTitle();
    renderDoc({ caret: 0, focus: false });
  }
  renderAll();
  getToken().then((t) => {
    if (t) {
      state.connected = true;
      updateStatusMeta();
      setTimeout(() => syncNow(true), 900);
    }
  });
}
boot();
</script>
</body>
</html>
