<style>
:root{--ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif;--serif:ui-serif,"Iowan Old Style","Palatino Linotype","Songti SC",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--bg:#f6f4ef;--side:#f1eee8;--paper:#fffefa;--ink:#2b2c30;--muted:#8e8a83;--faint:#b5b0a7;--line:#e7e2da;--hover:#e9e5de;--accent:#50588f;--accent-soft:#e8e9f3;--danger:#b3544b;--code-bg:#f3f1ec;--quote:#77736b}
body.dark{--bg:#191a1e;--side:#1f2025;--paper:#232428;--ink:#e7e4de;--muted:#94908a;--faint:#6d6a64;--line:#34353b;--hover:#2c2d33;--accent:#a9ade8;--accent-soft:#2e303e;--danger:#d98a82;--code-bg:#2b2c31;--quote:#a29e97}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.editor:focus,.editor:focus-visible{outline:none}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.app{display:grid;grid-template-columns:286px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100dvh;overflow:hidden}
/* sidebar */
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.sidebar-head{display:flex;align-items:center;gap:8px;padding:calc(20px + env(safe-area-inset-top)) 16px 12px}
.brand{display:flex;align-items:center;gap:9px;flex:1;font-weight:650;font-size:15px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;border-radius:8px;flex-shrink:0}
.brand img{width:26px;height:26px;object-fit:cover;border-radius:8px;flex-shrink:0}
.new-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.new-btn:hover{background:var(--hover);color:var(--ink)}
.new-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.search-wrap{position:relative;padding:2px 13px 10px}
.search-wrap svg{position:absolute;left:23px;top:12px;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.8;pointer-events:none}
.search{width:100%;height:32px;border-radius:8px;border:1px solid transparent;background:color-mix(in srgb,var(--hover) 80%,var(--side));padding:0 30px 0 31px;font-size:12.5px;outline:none;-webkit-appearance:none}
.search::placeholder{color:var(--faint)}
.search:focus{background:var(--paper);border-color:color-mix(in srgb,var(--accent) 32%,var(--line))}
.search-wrap kbd{position:absolute;right:21px;top:12px;font:10px var(--ui);color:var(--faint);pointer-events:none}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 12px;min-height:0}
.note-item{display:block;width:100%;text-align:left;padding:9px 11px 10px;border-radius:9px;margin:1px 0;min-width:0}
.note-item:hover{background:color-mix(in srgb,var(--hover) 65%,transparent)}
.note-item.active{background:var(--accent-soft)}
.note-top{display:flex;align-items:center;gap:6px;min-width:0}
.note-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.note-pin{width:11px;height:11px;color:var(--accent);flex-shrink:0;opacity:.9}
.note-pin svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note-excerpt{font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note-date{font-size:10.5px;color:var(--faint);margin-top:5px}
.list-empty{padding:36px 14px;text-align:center;font-size:12px;color:var(--faint);line-height:1.7}
.sidebar-foot{border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px}
.foot-btn{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:7px;font-size:11.5px;color:var(--muted);min-width:0}
.foot-btn:hover{background:var(--hover);color:var(--ink)}
.foot-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.foot-btn .count{font-size:10px;color:var(--faint)}
.foot-btn.icon{margin-left:auto;padding:0;width:30px;justify-content:center}
.foot-btn.on{color:var(--accent)}
/* main */
.main{display:flex;flex-direction:column;background:var(--paper);min-width:0;min-height:0}
.topbar{height:calc(46px + env(safe-area-inset-top));display:flex;align-items:center;gap:2px;padding:env(safe-area-inset-top) 10px 0;flex-shrink:0}
.topbar .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{color:var(--accent)}
.icon-btn.on svg{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.icon-btn:disabled{opacity:.32;cursor:default;background:none}
.icon-btn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back-btn{display:none}
.status{font-size:11px;color:var(--faint);margin-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.doc{max-width:700px;margin:0 auto;padding:16px clamp(24px,6vw,64px) 40vh}
.title{display:block;width:100%;border:0;background:none;outline:none;resize:none;overflow:hidden;padding:0;margin:0 0 20px;font:650 31px/1.22 var(--ui);letter-spacing:-.035em;color:var(--ink)}
.title::placeholder{color:var(--faint)}
.title:focus,.title:focus-visible{outline:none}
.editor{outline:none;min-height:55vh;font:400 16.5px/1.8 var(--serif);color:var(--ink);overflow-wrap:anywhere;caret-color:var(--accent);position:relative}
.editor.is-empty::before{content:"开始写作…";position:absolute;color:var(--faint);pointer-events:none}
.blk{position:relative;min-height:1.8em;white-space:pre-wrap;margin:0}
.blk.blank{min-height:1.8em}
.blk.p{margin:0 0 .15em}
.blk.h1,.blk.h2,.blk.h3,.blk.h4,.blk.h5,.blk.h6{font-family:var(--ui);font-weight:650;letter-spacing:-.03em;line-height:1.32;white-space:pre-wrap}
.blk.h1{font-size:28px;margin:20px 0 6px}
.blk.h2{font-size:23px;margin:18px 0 5px}
.blk.h3{font-size:19px;margin:16px 0 4px}
.blk.h4{font-size:16.5px;margin:14px 0 3px}
.blk.h5,.blk.h6{font-size:15px;margin:12px 0 3px;color:var(--muted)}
.blk.h1:first-child,.blk.h2:first-child,.blk.h3:first-child{margin-top:2px}
.blk.bullet,.blk.ordered,.blk.task{padding-left:1.5em}
.blk.bullet::before{content:"";position:absolute;left:.42em;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.blk.ordered::before{content:attr(data-num) ". ";position:absolute;left:.1em;color:var(--muted);font:13px/1.9 var(--ui);font-variant-numeric:tabular-nums}
.blk.task{padding-left:1.75em}
.blk.task .taskbox{position:absolute;left:.12em;top:.42em}
.taskbox{width:15px;height:15px;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center;background:transparent;flex-shrink:0}
.taskbox svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.taskbox.done{background:var(--accent);border-color:var(--accent)}
.taskbox.done svg{opacity:1}
body.dark .taskbox.done svg{stroke:#232428}
.blk.quote{padding-left:14px;border-left:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--quote);margin:3px 0}
.blk.hr{border-top:1px solid var(--line);min-height:0;height:0;margin:17px 0}
.blk.hr .mk{position:absolute;top:-.85em;background:var(--paper);padding-right:6px}
.blk.code{font:12.5px/1.65 var(--mono);background:var(--code-bg);border-radius:9px;padding:11px 14px;margin:8px 0;white-space:pre-wrap;tab-size:2;overflow-wrap:anywhere}
.blk.code .mk{color:var(--faint)}
strong{font-weight:700}
em{font-style:italic}
del{color:var(--muted)}
code{font:13px var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2.5px;text-decoration-thickness:1px;cursor:pointer}
.mk{display:none;color:var(--faint);font:400 .78em/1.2 var(--ui);letter-spacing:0}
.blk.active .mk{display:none}
.blk.code .mk{font:inherit;font-size:.95em;color:var(--faint)}
.animal-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:10px 0 14px}
.animal-choice{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:6px 2px;border:1px solid transparent;border-radius:9px;color:var(--muted);font-size:10px}
.animal-art{display:block;width:min(100%,48px);aspect-ratio:1;overflow:hidden;border-radius:12px;background:var(--accent-soft)}
.animal-choice img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.28);mix-blend-mode:multiply;border-radius:12px}
.animal-choice:hover{background:var(--hover)}
.animal-choice.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink)}
.animal-choice.selected .animal-art{outline:2px solid var(--accent);outline-offset:1px}
@media(max-width:480px){.animal-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* empty state */
.doc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16vh 20px;color:var(--muted)}
.doc-empty svg{width:42px;height:42px;border-radius:13px;margin-bottom:16px;opacity:.9}
.doc-empty img{width:54px;height:54px;object-fit:cover;border-radius:16px;margin-bottom:16px}
.doc-empty h2{font:600 18px var(--ui);letter-spacing:-.02em;color:var(--ink);margin:0 0 6px}
.doc-empty p{font-size:12.5px;line-height:1.7;margin:0 0 16px;color:var(--muted)}
.doc-empty .btn{height:33px;padding:0 13px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
body.dark .doc-empty .btn{color:#1c1d22}
/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(30,28,25,.34);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(480px,100%);max-height:min(86dvh,720px);overflow-y:auto;background:var(--paper);border:1px solid color-mix(in srgb,var(--line) 65%,transparent);border-radius:16px;box-shadow:0 24px 70px rgba(30,25,18,.22);padding:22px 24px 20px}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal-head h2{font:600 19px/1.2 var(--ui);letter-spacing:-.03em;margin:0;flex:1}
.modal-close{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);margin-right:-6px}
.modal-close:hover{background:var(--hover);color:var(--ink)}
.modal-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.section{padding:16px 0;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0;padding-top:8px}
.section-title{font:650 12px var(--ui);margin:0 0 4px}
.help{font-size:11px;line-height:1.65;color:var(--muted);margin:0 0 10px}
.field-label{display:block;font-size:10.5px;color:var(--muted);margin:9px 0 5px}
.field{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:12.5px;outline:none;-webkit-appearance:none}
.field:focus{background:var(--paper);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.field-row{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.check-row{display:flex;align-items:flex-start;gap:8px;margin-top:11px;font-size:11.5px;line-height:1.5;color:var(--muted);cursor:pointer}
.check-row input{accent-color:var(--accent);margin:2px 0 0;flex-shrink:0}
.switch-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;cursor:pointer}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch{width:36px;height:21px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0002;transition:transform .15s}
.switch-row input:checked+.switch{background:var(--accent)}
.switch-row input:checked+.switch::after{transform:translateX(15px)}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.btn{height:32px;padding:0 12px;border-radius:8px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
body.dark .btn.primary{color:#1c1d22}
.btn.ghost{background:var(--hover);color:var(--ink)}
.btn.ghost:hover{filter:brightness(.98)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal-status{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0;min-height:1.2em}
.modal-status.ok{color:#3f8a58}
.modal-status.err{color:var(--danger)}
/* note menu */
.menu{width:min(300px,100%);padding:6px}
.menu-title{font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 11px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--ink)}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.menu-item.danger{color:var(--danger)}
.menu-item.danger svg{stroke:var(--danger)}
.menu-item .shortcut{margin-left:auto;font-size:10px;color:var(--faint)}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:#2c2d33;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{display:none}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .19s ease;box-shadow:18px 0 50px rgba(0,0,0,.16)}
  .app.sidebar-open .sidebar{transform:translateX(0)}
  .overlay{display:block;position:fixed;inset:0;background:rgba(20,19,17,.32);z-index:29;opacity:0;pointer-events:none;transition:opacity .19s}
  .app.sidebar-open .overlay{opacity:1;pointer-events:auto}
  .back-btn{display:grid}
  .topbar{padding:0 6px}
  .doc{padding:6px 22px 45vh}
  .title{font-size:27px;margin-bottom:14px}
  .editor{font-size:16px}
  .status{display:none}
}
@media(min-width:761px){.app.sidebar-open .overlay{display:none}}

/* ---------- small helpers ---------- */
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'n' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g, '');
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

function fmtDate(t) {
  if (!t) return '刚刚';
  const d = new Date(t);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yest = new Date(now.getTime() - 864e5).toDateString() === d.toDateString();
  const hm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (sameDay) return hm;
  if (yest) return '昨天 ' + hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

  return [
    {
      id: 'welcome-note',
      title: '欢迎来到 Mori',
      body: [
        '这里是你的笔记本。输入 Markdown，它会在原地直接变成排版好的样子 —— 没有编辑和预览两种模式。',

function loadLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    state.notes = Array.isArray(raw) ? raw : defaultNotes();
  } catch (e) {
    state.notes = defaultNotes();
  }
  try {
    const prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    state.dark = typeof prefs.dark === 'boolean' ? prefs.dark : window.matchMedia('(prefers-color-scheme: dark)').matches;
    state.repo = prefs.repo || state.repo;
    state.dir = prefs.dir || state.dir;
    state.animal = ANIMALS.some((a) => a[0] === prefs.animal) ? prefs.animal : 'owl';
  } catch (e) { /* ignore */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({ dark: state.dark, animal: state.animal, repo: state.repo, dir: state.dir }));
  } catch (e) { /* ignore */ }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
    return true;

}

let savedTimer = null;
function saveSoon() {
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    saveLocal();
    setStatus(state.syncBusy ? '同步中…' : '已保存');
    scheduleSync();
  }, 260);
}

function currentNote() {
  return state.notes.find((n) => n.id === state.currentId) || null;
}

function activeNotes() {
  return state.notes.filter((n) => !n.deletedAt);
}

function noteExcerpt(n) {
  const s = String(n.body || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/<!--[\s\S]*?-->/g, ' ')
    .replace(/!\[[^\]]*\]\((?:data:image\/[^)]+|https?:\/\/[^)]+)\)/g, ' [图片] ')
    .replace(/[#>*_`~[\]()!-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return s.slice(0, 110) || '空白笔记';
}

function noteMatch(n) {
  if (state.view === 'trash') {
    if (!n.deletedAt) return false;
  } else if (n.deletedAt) {
    return false;
  }
  if (state.view === 'favorites' && !n.favorite) return false;
  if (state.view === 'today') { const d=new Date(n.updatedAt||n.createdAt||0); if(d.toDateString()!==new Date().toDateString())return false; }
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  return ((n.title || '') + '\n' + (n.body || '') + '\n' + ((n.tags || []).join(' '))).toLowerCase().includes(q);
}

function filteredNotes() {
  const list = state.notes.filter(noteMatch);
  list.sort((a, b) => {
    if (state.view !== 'trash' && !!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  return list;
}

/* ---------- markdown: blocks ---------- */
function parseImageMarkdown(raw) {
  const match = String(raw || '').trim().match(/^!\[([^\]\n]*)\]\((data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+|https?:\/\/[^\s)]+)\)$/i);
  return match ? { alt: match[1], src: match[2] } : null;
}

function blockType(line) {
  if (!line.trim()) return 'blank';
  if (parseImageMarkdown(line)) return 'image';
  let m;
  if ((m = line.match(/^(#{1,6})\s+/))) return 'h' + m[1].length;
  if (/^\s*[-*+]\s+\[[ xX]\]\s+/.test(line)) return 'task';
  if (/^\s*[-*+]\s+/.test(line)) return 'bullet';
  if (/^\s*\d+\.\s+/.test(line)) return 'ordered';
  if (/^\s*>\s?/.test(line)) return 'quote';
  if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) return 'hr';
  return 'p';
}

function latexToMathML(source) {
  const greek={alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',phi:'φ',omega:'ω',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Omega:'Ω'};
  const ops={times:'×',cdot:'·',div:'÷',pm:'±',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',approx:'≈',equiv:'≡',infty:'∞',sum:'∑',prod:'∏',int:'∫',to:'→',rightarrow:'→',leftarrow:'←',partial:'∂',nabla:'∇',forall:'∀',exists:'∃',in:'∈',notin:'∉',cup:'∪',cap:'∩',cdots:'⋯'};
  const esc=v=>escapeHtml(v);let i=0;const input=String(source||'');
  function group(){while(i<input.length&&/\s/.test(input[i]))i++;if(input[i]==='{'){i++;const v=sequence('}');if(input[i]==='}')i++;return '<mrow>'+v+'</mrow>';}return atom();}
  function atom(){
    while(i<input.length&&/\s/.test(input[i]))i++;if(i>=input.length)return '<mrow></mrow>';
    let value='',ch=input[i];
    if(ch==='\\'){i++;const start=i;while(i<input.length&&/[A-Za-z]/.test(input[i]))i++;const cmd=input.slice(start,i);
      if(!cmd&&i<input.length)value='<mo>'+esc(input[i++])+'</mo>';
      else if(cmd==='frac'){const a=group(),b=group();value='<mfrac>'+a+b+'</mfrac>';}
      else if(cmd==='sqrt')value='<msqrt>'+group()+'</msqrt>';
      else if(cmd==='text'||cmd==='mathrm'||cmd==='mathbf')value='<mstyle mathvariant="'+(cmd==='mathbf'?'bold':'normal')+'">'+group()+'</mstyle>';
      else if(greek[cmd])value='<mi>'+greek[cmd]+'</mi>';
      else if(ops[cmd])value='<mo>'+ops[cmd]+'</mo>';
      else if(['left','right','displaystyle','textstyle','quad','qquad',',',';','!'].includes(cmd))value='';
      else value='<mi>'+esc(cmd)+'</mi>';
    }else if(ch==='{')value=group();
    else if(/[0-9]/.test(ch)){const m=input.slice(i).match(/^\d+(?:\.\d+)?/)[0];i+=m.length;value='<mn>'+m+'</mn>';}
    else if(/[A-Za-z]/.test(ch)){const m=input.slice(i).match(/^[A-Za-z]+/)[0];i+=m.length;value='<mi>'+esc(m)+'</mi>';}
    else{i++;value=ch===' '?' <mspace width="0.25em"/>':'<mo>'+esc(ch)+'</mo>';}
    let sub='',sup='';while(input[i]==='_'||input[i]==='^'){const k=input[i++],v=group();if(k==='_')sub=v;else sup=v;}
    if(sub&&sup)value='<msubsup>'+value+sub+sup+'</msubsup>';else if(sub)value='<msub>'+value+sub+'</msub>';else if(sup)value='<msup>'+value+sup+'</msup>';return value;
  }
  function sequence(stop){const out=[];while(i<input.length&&input[i]!==stop){const before=i;out.push(atom());if(i===before)i++;}return out.join('');}

}
function mathExpression(raw){const lines=String(raw||'').split('\n');if(lines.length&&/^\s*\$\$\s*$/.test(lines[0]))lines.shift();if(lines.length&&/^\s*\$\$\s*$/.test(lines[lines.length-1]))lines.pop();return lines.join('\n').trim();}
function isTableLine(line){return /^\s*\|.*\|\s*$/.test(line)&&(line.match(/\|/g)||[]).length>=3;}
function renderTableBlock(b,active,index){
  const lines=b.raw.split('\n'),parsed=lines.map(line=>{const m=line.match(/^(\s*)\|(.*)\|(\s*)$/);return m?{lead:m[1],cells:m[2].split('|'),trail:m[3]}:{lead:'',cells:[line],trail:''};});
  const cols=Math.max(1,...parsed.map(r=>r.cells.length)),rows=parsed.map((r,ri)=>{
    if(r.cells.every(c=>/^\s*:?-{3,}:?\s*$/.test(c)))return '<div class="table-rule" contenteditable="false"><span class="mk">'+escapeHtml(lines[ri])+'</span></div>';
    let html='<span class="mk">'+escapeHtml(r.lead+'|')+'</span>';

function splitBlocks(md) {
  const lines = md.split('\n');
  const blocks = [];
  let off = 0;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const fence = line.trim().slice(0, 3);
      const closeRe = new RegExp('^\\s*' + fence.replace(/`/g, '\\`') + '\\s*$');
      let j = i + 1;
      let closed = false;
      while (j < lines.length) {
        if (closeRe.test(lines[j])) { closed = true; break; }
        j++;
      }
      const end = closed ? j : lines.length - 1;
      const raw = lines.slice(i, end + 1).join('\n');
      blocks.push({ raw, start: off, type: 'code', closed });
      off += raw.length + 1;
      i = end + 1;
      continue;
    }
    if (/^\s*\$\$\s*$/.test(line)) {
      let j=i+1;while(j<lines.length&&!/^\s*\$\$\s*$/.test(lines[j]))j++;
      const closed=j<lines.length,end=closed?j:lines.length-1,raw=lines.slice(i,end+1).join('\n');
      blocks.push({raw,start:off,type:'math',closed});off+=raw.length+1;i=end+1;continue;
    }
    if (isTableLine(line)&&i+1<lines.length&&isTableLine(lines[i+1])) {
      let j=i+1;while(j<lines.length&&isTableLine(lines[j]))j++;
      const raw=lines.slice(i,j).join('\n');blocks.push({raw,start:off,type:'table'});off+=raw.length+1;i=j;continue;
    }
    blocks.push({ raw: line, start: off, type: blockType(line) });
    off += line.length + 1;
    i++;

}

function blockIndexAt(blocks, offset) {
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (offset <= b.start + b.raw.length) return i;
  }
  return blocks.length - 1;
}

function splitPrefix(type, raw) {
  let m;
  if (type.startsWith('h')) {
    m = raw.match(/^(#{1,6}\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  if (type === 'bullet') {
    m = raw.match(/^(\s*[-*+]\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  if (type === 'task') {
    m = raw.match(/^(\s*[-*+]\s+\[)([ xX])(\]\s+)/);
    if (m) return { marker: m[0], text: raw.slice(m[0].length), stateAt: m[1].length, done: m[2].toLowerCase() === 'x' };
  }
  if (type === 'ordered') {
    m = raw.match(/^(\s*\d+\.\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length), num: m[1].trim().replace(/\.$/, '') };
  }
  if (type === 'quote') {
    m = raw.match(/^(\s*>\s?)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  return { marker: '', text: raw };
}

/* ---------- markdown: inline ---------- */
function inlineHtml(text) {
  let out = '';
  let i = 0;
  while (i < text.length) {
    const rest = text.slice(i);
    let m;
    if (rest[0] === '\\' && /[\\`*_{}[\]()#+\-.!>~]/.test(rest[1] || '')) {
      out += escapeHtml(rest.slice(0, 2));
      i += 2;
      continue;
    }
    if ((m = rest.match(/^`([^`\n]+)`/))) {
      out += '<code><span class="mk">`</span>' + escapeHtml(m[1]) + '<span class="mk">`</span></code>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^(\*\*|__)([^\n]+?)\1/))) {
      out += '<strong><span class="mk">' + escapeHtml(m[1]) + '</span>' + inlineHtml(m[2]) + '<span class="mk">' + escapeHtml(m[1]) + '</span></strong>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^(\*|_)([^\n]+?)\1/))) {
      out += '<em><span class="mk">' + escapeHtml(m[1]) + '</span>' + inlineHtml(m[2]) + '<span class="mk">' + escapeHtml(m[1]) + '</span></em>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^\+\+([^\n]+?)\+\+/))) {
      out += '<u><span class="mk">++</span>' + inlineHtml(m[1]) + '<span class="mk">++</span></u>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^~~([^\n]+?)~~/))) {
      out += '<del><span class="mk">~~</span>' + inlineHtml(m[1]) + '<span class="mk">~~</span></del>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^\[([^\]\n]+)\]\(([^)\s]+)\)/))) {
      if (/^(https?:|mailto:)/i.test(m[2])) {
        out += '<a href="' + escapeHtml(m[2]) + '" target="_blank" rel="noopener noreferrer"><span class="mk">[</span>' + escapeHtml(m[1]) + '<span class="mk">](' + escapeHtml(m[2]) + ')</span></a>';
      } else {
        out += escapeHtml(m[0]);
      }
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^https?:\/\/[^\s<>()"']+/))) {
      out += '<a href="' + escapeHtml(m[0]) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(m[0]) + '</a>';
      i += m[0].length;
      continue;
    }
    out += escapeHtml(rest[0]);
    i++;
  }
  return out;
}

/* ---------- markdown: render ---------- */
function renderBlock(b, active, index) {
  const cls = 'blk ' + b.type + (active ? ' active' : '');
  const attrs = ' data-i="' + index + '"';
  if (b.type === 'blank') return '<div class="' + cls + '"' + attrs + '><br></div>';
  if (b.type === 'table') return renderTableBlock(b, active, index);
  if (b.type === 'math') {
    const expr=mathExpression(b.raw);
    return '<div class="' + cls + ' math-block" contenteditable="false"' + attrs + ' data-raw="' + escapeHtml(b.raw) + '">' +
      '<div class="math-preview"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block">' + latexToMathML(expr) + '</math></div>' +
      '<span class="math-caption">公式 · 点击编辑 LaTeX</span></div>';
  }
  if (b.type === 'image') {
    const image = parseImageMarkdown(b.raw);
    if (!image) return '<div class="' + cls + '"' + attrs + '>' + escapeHtml(b.raw) + '</div>';
    return '<div class="' + cls + ' image-block" contenteditable="false"' + attrs + ' data-raw="' + escapeHtml(b.raw) + '">' +
      '<img src="' + escapeHtml(image.src) + '" alt="' + escapeHtml(image.alt) + '" loading="lazy" draggable="false">' +
      '</div>';
  }
  if (b.type === 'code') {
    const lines = b.raw.split('\n');
    if (!b.closed) {
      const rest = lines.slice(1);
      const opening = rest.length ? lines[0] + '\n' : lines[0];
      const body = rest.join('\n');
      return '<div class="' + cls + '"' + attrs + '><span class="mk">' + escapeHtml(opening) + '</span><span class="code">' + escapeHtml(body) + '</span></div>';
    }
    if (lines.length === 1) return '<div class="' + cls + '"' + attrs + '><span class="mk">' + escapeHtml(lines[0]) + '</span></div>';
    const middle = lines.slice(1, -1);
    const opening = lines[0] + '\n';
    const body = middle.join('\n');
    const closing = (middle.length ? '\n' : '') + lines[lines.length - 1];
    return '<div class="' + cls + '"' + attrs + '><span class="mk">' + escapeHtml(opening) + '</span><span class="code">' + escapeHtml(body) + '</span><span class="mk">' + escapeHtml(closing) + '</span></div>';
  }
  if (b.type === 'hr') return '<div class="' + cls + '"' + attrs + '><span class="mk">' + escapeHtml(b.raw) + '</span></div>';

  const p = splitPrefix(b.type, b.raw);
  const marker = p.marker ? '<span class="mk">' + escapeHtml(p.marker) + '</span>' : '';
  let extra = '';
  if (b.type === 'task') {
    extra = '<button class="taskbox' + (p.done ? ' done' : '') + '" contenteditable="false" tabindex="-1" data-task="' + (b.start + p.stateAt) + '" aria-label="切换完成状态"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></button>';
  }
  return '<div class="' + cls + '"' + attrs + (p.num ? ' data-num="' + escapeHtml(p.num) + '"' : '') + '>' + marker + extra + inlineHtml(p.text) + '</div>';
}

function renderDoc(opts) {
  const o = opts || {};
  const note = currentNote();
  if (!note) {
    editor.innerHTML = '';
    editor.classList.remove('is-empty');
    updateToolbarState();
    return;
  }
  const md = note.body || '';
  const blocks = splitBlocks(md);
  let active = -1;
  const focused = o.focus === true || document.activeElement === editor;
  if (typeof o.caret === 'number' && focused) active = blockIndexAt(blocks, o.caret);
  editor.classList.toggle('is-empty', md === '');
  editor.innerHTML = blocks.map((b, i) => renderBlock(b, i === active, i)).join('');
  if (typeof o.caret === 'number' && focused) {
    setCaret(o.caret);
    focusEditor();
  }
  updateToolbarState();
}

function inlineFormatRanges(line, kind) {
  const backtick = String.fromCharCode(96);
  const patterns = {
    bold: /(\*\*|__)(.+?)\1/g,
    italic: /(^|[^*])\*([^*\n]+)\*(?!\*)|(^|[^_])_([^_\n]+)_(?!_)/g,
    underline: /\+\+([^+\n]+)\+\+/g,
    strike: /~~([^~\n]+)~~/g,
    code: new RegExp(backtick+'([^'+backtick+'\n]+)'+backtick,'g'),
    link: /\[([^\]\n]+)\]\(([^)\s]+)\)/g
  };
  const re = patterns[kind];
  if (!re) return [];
  const ranges = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(line))) {
    if (kind === 'bold') {
      ranges.push({start:m.index + 2, end:m.index + 2 + m[2].length});
    } else if (kind === 'italic') {
      if (m[2] != null) ranges.push({start:m.index + m[1].length + 1, end:m.index + m[1].length + 1 + m[2].length});
      else if (m[4] != null) ranges.push({start:m.index + m[3].length + 1, end:m.index + m[3].length + 1 + m[4].length});
    } else if (kind === 'link') {
      ranges.push({start:m.index + 1, end:m.index + 1 + m[1].length});
    } else {
      const content = m[1];
      const delimiter = kind === 'underline' || kind === 'strike' ? 2 : 1;
      ranges.push({start:m.index + delimiter, end:m.index + delimiter + content.length});
    }
    if (!m[0].length) re.lastIndex++;
  }
  return ranges;
}

function toolbarRangeActive(ranges, start, end) {
  return ranges.some((r) => start === end
    ? start >= r.start && start <= r.end
    : start >= r.start && end <= r.end);
}

function updateToolbarState() {
  const toolbar = $('editor-toolbar');
  if (!toolbar) return;
  const note = currentNote();
  const focused = document.activeElement === editor || editor.contains(document.activeElement);
  const sel = focused ? selectionOffsets() : null;
  const caret = focused ? caretOffset() : null;
  const point = sel ? sel.start : (caret == null ? null : caret);
  const md = note ? note.body || '' : '';
  const blocks = note ? splitBlocks(md) : [];
  const firstIndex = point == null || !blocks.length ? -1 : blockIndexAt(blocks, point);
  const lastPoint = sel && sel.end > sel.start ? sel.end - 1 : point;
  const lastIndex = lastPoint == null || !blocks.length ? firstIndex : blockIndexAt(blocks, lastPoint);
  const sameBlock = firstIndex >= 0 && firstIndex === lastIndex;
  const block = sameBlock ? blocks[firstIndex] : null;
  const unsupportedBlock = !block || ['code','math','table','hr','image'].includes(block.type);
  const start = sel ? sel.start : point;
  const end = sel ? sel.end : point;
  const sameLine = start == null || end == null || md.slice(start, end).indexOf('\n') < 0;
  const inlineActive = {};

  if (block && start != null && end != null && sameLine && !unsupportedBlock) {
    const lineStart = md.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
    const lineEndAt = md.indexOf('\n', start);
    const lineEnd = lineEndAt < 0 ? md.length : lineEndAt;
    const line = md.slice(lineStart, lineEnd);
    const localStart = Math.max(0, start - lineStart);
    const localEnd = Math.max(0, end - lineStart);
    for (const kind of ['bold','italic','underline','strike','code','link']) {
      inlineActive[kind] = toolbarRangeActive(inlineFormatRanges(line, kind), localStart, localEnd);
    }
  }

  const blockKinds = new Set();
  if (block) {
    if (/^h[1-6]$/.test(block.type)) blockKinds.add(block.type);
    if (['bullet','ordered','task','quote'].includes(block.type)) blockKinds.add(block.type);
  }
  const canEdit = !!note && focused;
  toolbar.querySelectorAll('.tool-btn').forEach((button) => {
    const format = button.dataset.format;
    const kind = button.dataset.block;
    const isBlockTool = !!kind;
    const isInlineTool = !!format;
    const enabled = canEdit && !unsupportedBlock && (isBlockTool ? sameBlock : isInlineTool ? sameLine : true);
    const active = format ? !!inlineActive[format] : kind ? blockKinds.has(kind) : false;
    button.disabled = !enabled;
    button.classList.toggle('is-active', active);
    button.setAttribute('aria-pressed', String(active));
    if (!enabled) button.setAttribute('aria-disabled','true');
    else button.removeAttribute('aria-disabled');
  });
}

function updateActive() {
  const note = currentNote();
  if (note) {
    const off = caretOffset();
    if (off != null) {
      const blocks = splitBlocks(note.body || '');
      const idx = blockIndexAt(blocks, off);
      blockEls().forEach((el, i) => el.classList.toggle('active', i === idx));
    }
  }
  updateToolbarState();
}

/* ---------- caret & selection ---------- */
function blockEls() {
  return Array.from(editor.children).filter((el) => el.classList.contains('blk'));
}

function textOffsetWithin(root, node, offset) {
  if (node === root) {
    let acc = 0;
    const kids = Array.from(node.childNodes).slice(0, offset);
    for (const k of kids) acc += k.textContent.length;
    return acc;
  }
  if (node.nodeType === 3) {
    let acc = 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode === node) return acc + offset;
      acc += walker.currentNode.nodeValue.length;
    }
    return acc;
  }
  let acc = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n === node) {
      const kids = Array.from(node.childNodes).slice(0, offset);
      for (const k of kids) acc += k.textContent.length;
      return acc;
    }
    if (n.nodeType === 3) acc += n.nodeValue.length;
  }
  const kids = Array.from(node.childNodes).slice(0, offset);
  for (const k of kids) acc += k.textContent.length;
  return acc;
}

function blockSourceText(el) {
  if (!el) return '';
  if (el.classList.contains('math-block') || el.classList.contains('image-block')) return el.dataset.raw || '';
  if (el.classList.contains('table')) return blockText(el, false);
  return el.textContent;
}
function caretOffset() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.startContainer)) return null;
  if (r.startContainer === editor) {
    let off = 0;
    const kids = Array.from(editor.childNodes).slice(0, r.startOffset);
    for (const k of kids) off += blockSourceText(k).length + 1;
    return off;
  }
  let off = 0;
  for (const b of blockEls()) {
    if (b === r.startContainer || b.contains(r.startContainer)) {
      return off + textOffsetWithin(b, r.startContainer, r.startOffset);
    }
    off += blockSourceText(b).length + 1;
  }

async function compressImageFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) throw new Error('请选择图片文件。');
  const objectUrl = URL.createObjectURL(file);
  const image = new Image();
  try {
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error('浏览器无法解码这张图片。'));
      image.src = objectUrl;
    });

  const height = image.naturalHeight || image.height;

  const context = canvas.getContext('2d', { alpha:true });
  if (!context) throw new Error('当前浏览器不支持图片处理。');

  let best = null;
  for (const maxSide of [1800, 1500, 1250, 1000, 800]) {
    const scale = Math.min(1, maxSide / Math.max(width, height));
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    const src = await compressImageFile(file);
    const alt = String(file.name || '图片').replace(/\.[^.]+$/, '').replace(/[\[\]\r\n]/g, ' ').trim() || '图片';
    const markdown = '![' + alt + '](' + src + ')';
    const note = currentNote();
    if (!note) throw new Error('请先打开一篇笔记。');
    const md = note.body || '';
    const range = bookmark || captureImageBookmark() || { start:md.length, end:md.length };
    const start = Math.max(0, Math.min(md.length, range.start));
    const end = Math.max(start, Math.min(md.length, range.end));
    if (md.length - (end - start) + markdown.length > 700 * 1024) {
      throw new Error('这篇笔记的内容已接近 GitHub 同步大小限制，请移除一些图片后再插入。');
    }
    const before = md.slice(0, start);
    const after = md.slice(end);
    const lead = before && !before.endsWith('\n') ? '\n\n' : '';
    const tail = after && !after.startsWith('\n') ? '\n\n' : '';
    const next = before + lead + markdown + tail + after;
    focusEditor();
    applyBody(next, start + lead.length + markdown.length, true);
    ensureCaretVisible();
    toast('图片已插入');
  } catch (error) {
    toast('图片插入失败：' + (error && error.message || '未知错误'));
  }
}

function bindToolbar() {
  $('editor-toolbar').querySelectorAll('button').forEach((button) => {

      else if(f==='strike')wrapSelection('~~','~~');
      else if(f==='code')wrapSelection('\`','\`');
      else if(f==='link')wrapSelection('[','](https://)');

      else if(insert==='codeblock')insertBlockTemplate('\`\`\`\n\n\`\`\`',4);

  state.notes.unshift(note);

function trashNote() {

  reader.onload = () => {
    let text = String(reader.result || '').replace(/\r\n?/g, '\n');
    let title = file.name.replace(/\.(md|markdown|txt)$/i, '');
    const h = text.match(/^#\s+(.+)\n/);
    if (h) { title = h[1].trim(); text = text.slice(h[0].length).replace(/^\n+/, ''); }
    const now = Date.now();
    const note = { id: uid(), title, body: text, tags: [], createdAt: now, updatedAt: now, favorite: false, pinned: false, deletedAt: null };
    state.notes.unshift(note);
    state.view = 'all';
    state.search = '';
    $('search').value = '';
    saveLocal();
    openNote(note.id);
    closeModal();
    scheduleSync();
    toast('已导入');
  };
  reader.readAsText(file);
}

/* ---------- GitHub sync ---------- */
function repoPath() { return state.repo.split('/').map(encodeURIComponent).join('/'); }
function filePath(p) { return p.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }

async function githubRequest(path, opts) {
  const o = opts || {};
  const token = await getToken();
  if (!token) throw new Error('请先在设置中连接 GitHub。');
  const res = await fetch('https://api.github.com' + path, {
    method: o.method || 'GET',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: 'Bearer ' + token,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(o.body ? { 'Content-Type': 'application/json' } : {})
    },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (res.status === 204) return {};
  let payload = null;
  const text = await res.text();
  try { payload = text ? JSON.parse(text) : {}; } catch (e) { payload = { message: text }; }
  if (!res.ok) {
    const err = new Error((payload && payload.message) || 'GitHub API 错误 ' + res.status);
    err.status = res.status;
    throw err;
  }
  return payload;
}

function encodeBase64Utf8(s) {
  const bytes = new TextEncoder().encode(s);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function decodeBase64Utf8(s) {
  const binary = atob(String(s || '').replace(/\s/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function noteFileContent(n) {
  const meta = {
    id: n.id,
    title: n.title || '',
    tags: n.tags || [],
    createdAt: n.createdAt || Date.now(),
    updatedAt: n.updatedAt || Date.now(),
    favorite: !!n.favorite,
    pinned: !!n.pinned,
    deletedAt: n.deletedAt || null
  };
  return '<!-- MORI_NOTE\n' + JSON.stringify(meta) + '\n-->\n' + (n.body || '') + '\n';
}

function parseNoteFile(raw, filename) {
  const m = raw.match(/^<!-- MORI_NOTE\s*\n([\s\S]*?)\n-->\s*\n?/);
  if (m) {
    try {
      const meta = JSON.parse(m[1]);
      let body = raw.slice(m[0].length);
      if (body.endsWith('\n')) body = body.slice(0, -1);
      return {
        ...meta,
        id: meta.id || filename.replace(/\.md$/, ''),
        body,
        tags: Array.isArray(meta.tags) ? meta.tags : [],
        title: meta.title || '',
        createdAt: meta.createdAt || Date.now(),
        updatedAt: meta.updatedAt || Date.now(),
        favorite: !!meta.favorite,
        pinned: !!meta.pinned,
        deletedAt: meta.deletedAt || null
      };
    } catch (e) { /* fall through */ }
  }
  let title = filename.replace(/\.md$/, '');
  let body = raw;
  const h = raw.match(/^#\s+(.+)\n/);
  if (h) { title = h[1].trim(); body = raw.slice(h[0].length); }
  if (body.endsWith('\n')) body = body.slice(0, -1);
  return { id: filename.replace(/\.md$/, ''), title, body, tags: [], createdAt: Date.now(), updatedAt: Date.now(), favorite: false, pinned: false, deletedAt: null };
}

async function listRemoteNotes() {
  const path = '/repos/' + repoPath() + '/contents/' + filePath(state.dir);
  let listing;
  try {
    listing = await githubRequest(path);
  } catch (e) {
    if (e.status === 404) return [];
    throw e;
  }
  if (!Array.isArray(listing)) throw new Error('笔记目录不是文件夹，请检查同步目录设置。');
  const files = listing.filter((x) => x.type === 'file' && x.name.endsWith('.md'));
  const notes = [];
  for (let i = 0; i < files.length; i += 5) {
    const batch = files.slice(i, i + 5);
    const got = await Promise.all(batch.map(async (f) => {
      const data = await githubRequest('/repos/' + repoPath() + '/contents/' + filePath(f.path));
      return { note: parseNoteFile(decodeBase64Utf8(data.content), f.name), sha: data.sha, path: f.path };
    }));
    notes.push(...got);
  }
  return notes;
}

async function putRemoteNote(n, sha) {
  const file = (state.dir.replace(/^\/+|\/+$/g, '') + '/' + n.id + '.md').split('/').filter(Boolean).join('/');
  const body = { message: 'Mori: ' + (sha ? 'update' : 'add') + ' note — ' + (n.title || 'untitled').slice(0, 50), content: encodeBase64Utf8(noteFileContent(n)) };
  if (sha) body.sha = sha;
  return githubRequest('/repos/' + repoPath() + '/contents/' + filePath(file), { method: 'PUT', body });
}

async function syncNow(silent) {
  if (state.syncBusy) return;
  const token = await getToken();
  if (!token) {
    if (!silent) { openSettings(); toast('先连接 GitHub 私有仓库'); }
    return;
  }
  state.syncBusy = true;
  state.syncError = '';
  renderChrome();
  if (!silent) toast('正在同步…');
  try {
    const meta = await githubRequest('/repos/' + repoPath());
    if (!meta.private) throw new Error('请连接私有仓库，避免笔记被公开。');
    const remote = await listRemoteNotes();
    const remoteById = new Map(remote.map((x) => [x.note.id, x]));
    const localById = new Map(state.notes.map((n) => [n.id, n]));
    let changed = false;

    for (const r of remote) {
      const l = localById.get(r.note.id);
      if (!l || (r.note.updatedAt || 0) >= (l.updatedAt || 0)) {
        const ix = state.notes.findIndex((n) => n.id === r.note.id);
        if (ix >= 0) state.notes[ix] = r.note; else state.notes.push(r.note);
        changed = true;
      } else {
        try {
          await putRemoteNote(l, r.sha);
        } catch (e) {
          if (e.status === 409 || e.status === 422) {
            const fresh = await githubRequest('/repos/' + repoPath() + '/contents/' + filePath(r.path));
            const rn = parseNoteFile(decodeBase64Utf8(fresh.content), r.note.id + '.md');
            if ((rn.updatedAt || 0) > (l.updatedAt || 0)) {
              const ix = state.notes.findIndex((n) => n.id === l.id);
              if (ix >= 0) state.notes[ix] = rn;
            } else {
              await putRemoteNote(l, fresh.sha);
            }
            changed = true;
          } else throw e;
        }
      }
    }

    const remoteIds = new Set(remote.map((r) => r.note.id));
    for (const l of state.notes.slice()) {
      if (remoteIds.has(l.id)) continue;
      try {
        await putRemoteNote(l, null);
      } catch (e) {
        if (e.status === 409 || e.status === 422) {
          const x = await listRemoteNotes();
          const r = x.find((z) => z.note.id === l.id);
          if (r && (r.note.updatedAt || 0) >= (l.updatedAt || 0)) {
            const ix = state.notes.findIndex((n) => n.id === l.id);
            if (ix >= 0) state.notes[ix] = r.note;
          } else if (r) {
            await putRemoteNote(l, r.sha);
          } else throw e;
          changed = true;
        } else throw e;
      }
    }

    state.lastSynced = Date.now();
    if (changed) {
      saveLocal();
      renderList();
      const cur = currentNote();
      if (cur) {
        titleEl.value = cur.title || '';
        growTitle();
        renderDoc({ caret: Math.min(lastCaret, (cur.body || '').length), focus: false });
      }
    }
    updateStatusMeta();
    if (!silent) toast('已同步');
  } catch (e) {
    state.syncError = e.message || String(e);
    if (!silent) toast('同步失败：' + state.syncError);
  } finally {
    state.syncBusy = false;
    renderChrome();
  }
}

function scheduleSync() {
  if (!state.connected) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(true), 2600);
}

/* ---------- encrypted token vault ---------- */
let vaultPromise;
function vaultDb() {
  if (vaultPromise) return vaultPromise;
  vaultPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('mori-secure-vault', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('vault')) db.createObjectStore('vault');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return vaultPromise;
}

async function vaultGet(key) {
  const db = await vaultDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('vault', 'readonly');
    const r = tx.objectStore('vault').get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

async function vaultSet(key, value) {
  const db = await vaultDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('vault', 'readwrite');
    tx.objectStore('vault').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function vaultDelete(key) {
  try {
    const db = await vaultDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('vault', 'readwrite');
      tx.objectStore('vault').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* ignore */ }
}

async function saveVaultToken(token) {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  await vaultSet('token-key', key);
  await vaultSet('token-cipher', { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) });
}

async function loadVaultToken() {
  try {
    const stored = await vaultGet('token-cipher');
    const key = await vaultGet('token-key');
    if (!stored || !key) return '';
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(stored.iv) }, key, new Uint8Array(stored.data));
    return new TextDecoder().decode(plain);
  } catch (e) {
    return '';
  }
}

async function getToken() {
  if (state.token) return state.token;
  const s = sessionStorage.getItem(SESSION_KEY);
  if (s) { state.token = s; state.connected = true; return s; }
  const v = await loadVaultToken();
  if (v) { state.token = v; state.connected = true; }
  return v;
}

async function saveConnection() {
  const repo = $('repo-field').value.trim();
  const dir = $('dir-field').value.trim().replace(/^\/+|\/+$/g, '') || 'mori-notes';
  const typed = $('token-field').value.trim();
  const remember = $('remember-token').checked;
  const status = $('settings-status');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    status.className = 'modal-status err';
    status.textContent = '仓库格式应为 owner/repo。';
    return;
  }
  state.repo = repo;
  state.dir = dir;
  state.tokenMode = remember ? 'device' : 'session';
  try {
    if (typed) {
      state.token = typed;
      state.connected = true;
      if (remember) {
        sessionStorage.removeItem(SESSION_KEY);
        await saveVaultToken(typed);
      } else {
        sessionStorage.setItem(SESSION_KEY, typed);
        await vaultDelete('token-cipher');
        await vaultDelete('token-key');
      }
    } else {
      const t = await getToken();
      state.connected = !!t;
    }
    savePrefs();
    saveLocal();
    if (!state.connected) {
      status.className = 'modal-status';
      status.textContent = '设置已保存。输入令牌后即可连接。';
      return;
    }
    status.className = 'modal-status';
    status.textContent = '正在验证…';
    const meta = await githubRequest('/repos/' + repoPath());
    if (!meta.private) throw new Error('仓库必须是私有的，避免笔记被公开。');
    status.className = 'modal-status ok';
    status.textContent = '连接成功。';
    updateStatusMeta();
    setTimeout(() => { if ($('modal-root').innerHTML) closeModal(); }, 700);
    setTimeout(() => syncNow(true), 500);
  } catch (e) {
    state.syncError = e.message || String(e);
    status.className = 'modal-status err';
    status.textContent = '连接失败：' + state.syncError;
    updateStatusMeta();
  }
}

async function forgetToken() {
  if (!confirm('忘记此设备保存的 GitHub 令牌？这不会删除远端笔记。')) return;
  state.token = '';
  state.connected = false;
  sessionStorage.removeItem(SESSION_KEY);
  await vaultDelete('token-cipher');
  await vaultDelete('token-key');
  const f = $('token-field');
  if (f) f.value = '';
  const status = $('settings-status');
  if (status) { status.className = 'modal-status'; status.textContent = '令牌已移除，远端笔记未受影响。'; }
  updateStatusMeta();
  toast('已忘记令牌');
}

/* ---------- bind ---------- */
function bind() {
  $('new-btn').addEventListener('click', createNote);
  $('empty-new').addEventListener('click', createNote);
  $('settings-btn').addEventListener('click', openSettings);
  $('sync-btn').addEventListener('click', () => syncNow(false));
  $('star-btn').addEventListener('click', toggleFavorite);
  $('more-btn').addEventListener('click', openNoteMenu);
  $('nav-btn').addEventListener('click', () => { if(app.classList.contains('sidebar-open')) closeSidebar(); else { closeNoteList(); openSidebar(); } });
  $('back-btn').addEventListener('click', () => { if(app.classList.contains('list-open')) closeNoteList(); else { closeSidebar(); openNoteList(); } });
  $('overlay').addEventListener('click', closeDrawers);
  document.querySelectorAll('[data-switch-view]').forEach((button) => button.addEventListener('click', () => {
    state.view=button.dataset.switchView; state.search=''; $('search').value=''; const list=filteredNotes();
    if(!list.some(n=>n.id===state.currentId)){const first=list[0];if(first)openNote(first.id);else{state.currentId=null;renderAll();}}
    else renderAll(); closeSidebar(); if(window.matchMedia('(max-width:760px)').matches)openNoteList();
  }));
  bindToolbar();
  $('trash-btn').addEventListener('click', () => {
    state.view = state.view === 'trash' ? 'all' : 'trash';
    state.search = '';
    $('search').value = '';
    const list = filteredNotes();
    if (!list.some((n) => n.id === state.currentId)) {
      const first = list[0];
      if (first) openNote(first.id); else { state.currentId = null; renderAll(); }
    } else {
      renderList();
      renderChrome();
    }
  });
  $('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    const list = filteredNotes();
    if (!list.some((n) => n.id === state.currentId)) {
      const first = list[0];
      if (first) openNote(first.id); else { state.currentId = null; renderAll(); }
    } else {
      renderList();
      renderChrome();
    }
  });
  $('search').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.target.value = '';
      state.search = '';
      renderList();
      renderChrome();
      e.target.blur();
    }
  });
  $('import-file').addEventListener('change', (e) => {
    importFile(e.target.files && e.target.files[0]);
    e.target.value = '';
  });
  $('image-file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    const bookmark = pendingImageBookmark;
    pendingImageBookmark = null;
    if (file) insertImageFile(file, bookmark);
  });

  titleEl.addEventListener('input', () => {
    const n = currentNote();
    if (!n) return;
    n.title = titleEl.value;
    n.updatedAt = Date.now();
    growTitle();
    saveSoon();
    updateListItem();
  });
  titleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); focusEditor(); setCaret((currentNote() || {}).body ? (currentNote().body.length) : 0); }
  });

  editor.addEventListener('input', () => {
    if (composing) return;
    syncFromDom();
  });

  editor.addEventListener('compositionstart', () => { composing = true; });
  editor.addEventListener('compositionend', () => {
    composing = false;
    syncFromDom();
  });

  editor.addEventListener('beforeinput', (e) => {
    const t = e.inputType;
    if (t === 'insertText' && !composing && typeof e.data === 'string' && e.data) {
      e.preventDefault();
      insertTextAt(e.data, false);
      return;
    }
    if (t === 'insertParagraph' || t === 'insertLineBreak') {
      e.preventDefault();
      handleEnter();
      return;
    }
    if (t === 'insertFromPaste' || t === 'insertFromDrop') {
      e.preventDefault();
      return;
    }
    if (t === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (t === 'historyRedo') { e.preventDefault(); redo(); return; }
    if (t === 'formatBold') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (t === 'formatItalic') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (t === 'deleteContentBackward') {
      if (handleBackspace()) e.preventDefault();
      return;
    }
    if (t === 'deleteContentForward') {
      if (handleDelete()) e.preventDefault();
      return;
    }
    if (t === 'deleteByCut') {
      const sel = selectionOffsets();
      if (sel && sel.start !== sel.end) {
        const note = currentNote();
        const text = (note.body || '').slice(sel.start, sel.end);
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        e.preventDefault();
        deleteRange(sel.start, sel.end);
      }
    }
  });

  editor.addEventListener('paste', (e) => {
    const clipboard = e.clipboardData;
    const imageItem = clipboard && Array.from(clipboard.items || []).find((item) => item.kind === 'file' && item.type.startsWith('image/'));
    if (imageItem) {
      const file = imageItem.getAsFile();
      if (file) {
        e.preventDefault();
        insertImageFile(file, captureImageBookmark());
        return;
      }
    }
    const text = clipboard ? clipboard.getData('text/plain') : '';
    if (!text) return;
    e.preventDefault();
    insertTextAt(text.replace(/\r\n?/g, '\n'), true);
  });

  editor.addEventListener('click', (e) => {
    const mathBlock=e.target.closest&&e.target.closest('.math-block');
    if(mathBlock){
      e.preventDefault();
      const note=currentNote(),blocks=splitBlocks(note?note.body||'':''),block=blocks[Number(mathBlock.dataset.i)];
      if(block&&block.type==='math'){
        const edited=window.prompt('编辑 LaTeX 公式',mathExpression(block.raw));
        if(edited!=null){
          const raw='$$\n'+edited+'\n$$',body=note.body||'';
          let next=body.slice(0,block.start)+raw+body.slice(block.start+block.raw.length);
          if(block.start+raw.length===next.length)next+='\n';
          applyBody(next,block.start+raw.length+(block.start+raw.length===next.length-1?1:0),true);
        }
      }
      return;
    }
    const box = e.target.closest && e.target.closest('.taskbox');
    if (box) {
      e.preventDefault();
      toggleTask(Number(box.dataset.task));
      return;
    }
    const link = e.target.closest && e.target.closest('a');
    if (link) {
      if (e.metaKey || e.ctrlKey) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
      else e.preventDefault();
    }
  });

  editor.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Tab') {
      e.preventDefault();
      insertTextAt('  ', true);
      return;
    }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'i') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); wrapSelection('[', '](https://)'); return; }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); redo(); return; }
  });

  document.addEventListener('selectionchange', () => {
    if (composing) return;
    if (document.activeElement !== editor && !editor.contains(document.activeElement)) {
      updateToolbarState();
      return;
    }
    const off = caretOffset();
    if (off != null) lastCaret = off;
    updateActive();
  });
  editor.addEventListener('keyup', updateActive);
  editor.addEventListener('mouseup', updateActive);
  editor.addEventListener('focus', updateToolbarState);
  editor.addEventListener('blur', () => requestAnimationFrame(updateToolbarState));

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k' && !e.shiftKey) {
      e.preventDefault();
      if(window.matchMedia('(max-width:760px)').matches)openNoteList();
      $('search').focus();
      $('search').select();
      return;
    }
    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); createNote(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); syncNow(false); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'f') {
      if (currentNote()) { e.preventDefault(); toggleFavorite(); }
      return;
    }
    if (e.key === 'Escape') {
      if ($('row-context-menu')) { closeRowContextMenu(); return; }
      if ($('modal-root').innerHTML) { closeModal(); return; }
      if (document.activeElement === $('search')) { $('search').blur(); return; }
      if (app.classList.contains('sidebar-open')) { closeSidebar(); return; }
    }
  });

  window.addEventListener('beforeunload', () => { saveLocal(); });
  window.addEventListener('resize', () => { growTitle(); });
}

/* ---------- boot ---------- */
function boot() {
  loadLocal();
  applyAnimal();
  applyDark();
  bind();
  const first = filteredNotes()[0];
  if (first) {
    state.currentId = first.id;
    histReset(first);
    titleEl.value = first.title || '';
    growTitle();
    renderDoc({ caret: 0, focus: false });
  }
  renderAll();
  getToken().then((t) => {
    if (t) {
      state.connected = true;
      updateStatusMeta();
      setTimeout(() => syncNow(true), 900);
    }
  });
}
boot();
</script>
