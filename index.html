<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfd">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="Mori">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mori">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mori</title>
<link rel="apple-touch-icon" id="touch-icon" href="icons/apple-touch-icon-owl.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="page-favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2350588f'/%3E%3Cpath d='M18 46V18h5l9 14 9-14h5v28h-5V27l-9 13-9-13v19Z' fill='%23fffefa'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Mori — consolidated stylesheet
   tokens → base → layout → sidebar → list → topbar → document
   → toolbar → blocks → table/math/image → dialogs → responsive
   ============================================================ */
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype","Songti SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;--ease:cubic-bezier(.2,.7,.2,1);
  --doc-font:var(--ui);--doc-size:16.5px;
  --head-ctl:34px; /* logo, sidebar toggle and new-note button share one size */
  color-scheme:light;
}
/* Each animal sets --h (hue), --s / --al (accent saturation / lightness), --ds
   (dark-mode accent saturation) and --t (how strongly surfaces are tinted).
   Everything else is derived, so themes stay coherent and clearly distinct. */
html{background:var(--page-bg,#f6f6f8)}
body{
  --h:232;--s:58%;--al:59%;--ds:62%;--t:1;
  --bg:hsl(var(--h) calc(var(--t) * 34%) 95%);
  --side:hsl(var(--h) calc(var(--t) * 40%) 91.5%);
  --list-bg:hsl(var(--h) calc(var(--t) * 38%) 96.8%);
  --paper:hsl(var(--h) calc(var(--t) * 45%) 99.3%);
  --ink:hsl(var(--h) calc(var(--t) * 30%) 12%);
  --muted:hsl(var(--h) calc(var(--t) * 13%) 34%);
  --faint:hsl(var(--h) calc(var(--t) * 9%) 43%);
  --line:hsl(var(--h) calc(var(--t) * 26%) 86.5%);
  --hover:hsl(var(--h) calc(var(--t) * 36%) 88.5%);
  --accent:hsl(var(--h) var(--s) var(--al));--accent-ink:#fff;
  --accent-soft:hsl(var(--h) calc(var(--t) * 75%) 90%);
  --accent-text:hsl(var(--h) var(--s) calc(var(--al) - 8%));
  --danger:#c23b2c;--ok:#23864a;--code-bg:hsl(var(--h) calc(var(--t) * 30%) 93.5%);--quote:hsl(var(--h) calc(var(--t) * 14%) 34%);
}
body.dark{
  --bg:hsl(var(--h) calc(var(--t) * 22%) 8%);
  --side:hsl(var(--h) calc(var(--t) * 22%) 10.5%);
  --list-bg:hsl(var(--h) calc(var(--t) * 20%) 12%);
  --paper:hsl(var(--h) calc(var(--t) * 18%) 14%);
  --ink:hsl(var(--h) calc(var(--t) * 25%) 93%);
  --muted:hsl(var(--h) calc(var(--t) * 14%) 73%);
  --faint:hsl(var(--h) calc(var(--t) * 10%) 61%);
  --line:hsl(var(--h) calc(var(--t) * 16%) 22%);
  --hover:hsl(var(--h) calc(var(--t) * 20%) 19%);
  --accent:hsl(var(--h) var(--ds) 72%);--accent-ink:hsl(var(--h) 40% 9%);
  --accent-soft:hsl(var(--h) calc(var(--t) * 35%) 23%);
  --accent-text:hsl(var(--h) var(--ds) 76%);
  --danger:#f0948a;--ok:#86d39e;--code-bg:hsl(var(--h) calc(var(--t) * 18%) 18.5%);--quote:hsl(var(--h) calc(var(--t) * 14%) 74%);
  color-scheme:dark;
}

/* The navigation column is a tinted near-black in both modes: a dark frame
   around the light list and page. Its tokens are re-scoped so every control
   inside (nav items, groups, buttons) adapts without extra rules. */
.sidebar{
  --side:hsl(var(--h) calc(var(--t) * 38%) 11.5%);
  --ink:hsl(var(--h) calc(var(--t) * 18%) 94%);
  --muted:hsl(var(--h) calc(var(--t) * 12%) 73%);
  --faint:hsl(var(--h) calc(var(--t) * 10%) 57%);
  --hover:hsl(var(--h) calc(var(--t) * 24%) 17.5%);
  --line:hsl(var(--h) calc(var(--t) * 18%) 21%);
  --paper:hsl(var(--h) calc(var(--t) * 22%) 15%);
  --accent:hsl(var(--h) var(--ds) 72%);
  --accent-text:hsl(var(--h) var(--ds) 79%);
  --accent-soft:hsl(var(--h) calc(var(--t) * 52%) 23%);
  --code-bg:hsl(var(--h) calc(var(--t) * 22%) 18%);
  color:var(--ink);
  color-scheme:dark;
}
body.dark .sidebar{--side:hsl(var(--h) calc(var(--t) * 22%) 6.5%);--hover:hsl(var(--h) calc(var(--t) * 18%) 13%);--accent-soft:hsl(var(--h) calc(var(--t) * 35%) 18%)}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.editor:focus,.editor:focus-visible,.title:focus,.title:focus-visible,.search:focus-visible,.modal:focus,.modal:focus-visible{outline:none}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:224px 320px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden;background:var(--bg)}
.overlay{display:none}

/* ---------- navigation sidebar ---------- */
.sidebar{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--side);padding:calc(22px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.sidebar-head{display:flex;align-items:center;gap:8px;padding:0 0 26px;min-height:34px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:17px;font-weight:680;letter-spacing:-.03em}
.brand-mark{width:var(--head-ctl);height:var(--head-ctl);display:grid;place-items:center;overflow:hidden;border-radius:10px;background:var(--accent-soft);flex-shrink:0}
.brand-mark img{width:100%;height:100%;object-fit:cover;transform:scale(1.28)}

.brand-name{line-height:1}
.brand-edition{display:none}
.nav-section-label{font-size:11.5px;font-weight:650;letter-spacing:.08em;color:var(--faint);padding:0 8px;margin:0 0 8px}
.nav-list{display:grid;gap:2px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px 0 8px;border-radius:9px;text-align:left;font-size:14px;color:var(--muted);transition:background .12s,color .12s}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.active,.nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:620}
.nav-item.active svg,.nav-item.on svg{color:var(--accent)}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item span:first-of-type{flex:1}
.nav-count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px 12px;scrollbar-width:thin}
.nav-group{margin-top:18px}
.nav-group-head{display:flex;align-items:center;gap:2px;padding:0;margin-bottom:4px}
.nav-group-toggle{flex:1;display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:650;letter-spacing:.08em;color:var(--faint);text-align:left}
.nav-group-toggle:hover{color:var(--muted);background:var(--hover)}
.nav-group-toggle .chev{order:2;width:12px;height:12px;opacity:.7;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transition:transform .15s}
.nav-group.collapsed .chev{transform:none}
.nav-group.collapsed .nav-list{display:none}
.nav-group-add{width:34px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--faint)}
.nav-group-add:hover{background:var(--hover);color:var(--accent-text)}
.nav-group-add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-empty{width:100%;padding:8px 11px;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--faint);text-align:left;line-height:1.5}
.nav-empty:hover{border-color:var(--accent);color:var(--accent-text)}
.nav-empty-text{margin:2px 8px;font-size:12.5px;line-height:1.6;color:var(--faint)}
.nav-empty-text code{color:var(--accent-text)}
.nav-item.drop-target{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-text)}
.dragging-note .nav-item[data-folder],.dragging-note .nav-item[data-switch-view="all"]{outline:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:-2px}
.note-folder{display:inline-block;margin-left:8px;padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--accent-soft) 70%,transparent);color:var(--accent-text);font-size:11px;line-height:17px;vertical-align:1px}
.note-item.active .note-folder{background:var(--paper)}
.tag{color:var(--accent-text);background:color-mix(in srgb,var(--accent-soft) 60%,transparent);border-radius:5px;padding:0 3px}
.menu-item.current{color:var(--accent-text);font-weight:600}
.menu-check{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.ask-modal{width:min(400px,100%)}
.ask-modal .field{margin-top:12px}
.nav-toggle{display:grid;place-items:center;flex-shrink:0;width:var(--head-ctl);height:var(--head-ctl);margin:0 2px 0 0;border-radius:10px;color:var(--faint);transition:background .12s,color .12s}
.nav-toggle:hover{background:var(--hover);color:var(--ink)}
.nav-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-toggle .panel-fill{fill:currentColor;stroke:none;opacity:.28;transition:opacity .15s}
.app.nav-collapsed .nav-toggle .panel-fill{opacity:0}
.list-title-wrap{flex:1;min-width:0}
.list-heading-row h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:761px){
  .app{transition:grid-template-columns .22s var(--ease)}
  .app.nav-collapsed{grid-template-columns:0 320px minmax(0,1fr)}
  .app.nav-collapsed .sidebar{visibility:hidden;padding-inline:0;overflow:hidden}
}
.sidebar-bottom{margin-top:auto;padding:10px 0 0;display:flex;align-items:center;gap:4px}
.bottom-btn{width:var(--head-ctl);height:var(--head-ctl);display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.bottom-btn:hover{background:var(--hover);color:var(--ink)}
.bottom-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bottom-btn .icon-moon{display:none}
body.dark .bottom-btn .icon-sun{display:none}
body.dark .bottom-btn .icon-moon{display:block}
.sidebar-version,.list-eyebrow{display:none}

/* ---------- note list ---------- */
.note-sidebar{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--list-bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.list-header{padding:calc(22px + env(safe-area-inset-top)) 16px 12px}
.list-heading-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:34px}
.list-heading-row h1{font-size:24px;line-height:1.15;letter-spacing:-.04em;font-weight:660;margin:0;color:var(--ink)}
.new-btn{width:var(--head-ctl);height:var(--head-ctl);display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--accent-ink);flex-shrink:0;transition:filter .12s,transform .12s}
.new-btn:hover{filter:brightness(1.08)}
.new-btn:active{transform:scale(.95)}
.new-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.search-wrap{position:relative;display:block;margin:0}
.search-wrap>svg{position:absolute;left:9px;top:50%;margin-top:-8px;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8;pointer-events:none;stroke-linecap:round}
.search{width:100%;height:38px;border:1px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--hover) 70%,var(--list-bg));padding:0 54px 0 34px;font-size:14px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search:focus{background:var(--paper);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.search::placeholder{color:var(--faint)}
.search::-webkit-search-cancel-button{display:none}
.search-wrap kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11.5px var(--ui);color:var(--faint);pointer-events:none;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:var(--list-bg)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 16px;min-height:0}
.note-item{display:block;position:relative;width:100%;text-align:left;padding:11px 10px 12px;border-radius:11px;margin:2px 0;min-width:0;transition:background .12s}
.note-item:hover{background:color-mix(in srgb,var(--hover) 80%,transparent)}
.note-item.active{background:var(--accent-soft)}
.note-top{display:flex;align-items:center;gap:6px;min-width:0}
.note-title{font:600 14.5px/1.4 var(--ui);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.note-pin{width:13px;height:13px;color:var(--accent);flex-shrink:0;display:grid;place-items:center}
.note-pin svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note-excerpt{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:13px;line-height:1.55;color:var(--muted);margin-top:4px}
.note-date{display:block;font-size:12px;color:var(--faint);margin-top:6px}
.list-empty{padding:48px 18px;text-align:center;font-size:13.5px;color:var(--faint);line-height:1.8}
.list-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.sync-state{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.sync-dot{width:7px;height:7px;background:var(--faint);border-radius:50%;display:inline-block;flex-shrink:0}
.sync-dot.connected{background:var(--ok)}
.sync-dot.busy{background:var(--accent);animation:syncpulse 1s ease-in-out infinite}
@keyframes syncpulse{50%{opacity:.3}}

/* ---------- main column ---------- */
.main{grid-column:3;grid-row:1;display:flex;flex-direction:column;background:var(--paper);min-width:0;min-height:0}
.topbar{height:calc(52px + env(safe-area-inset-top));display:flex;align-items:center;gap:4px;padding:env(safe-area-inset-top) 20px 0;flex-shrink:0}
.topbar .spacer{flex:1}
.status{font-size:12.5px;color:var(--faint);margin-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{color:var(--accent)}
.icon-btn.on svg{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.icon-btn:disabled{opacity:.35;cursor:default;background:none}
.icon-btn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-toggle-btn,.back-btn{display:none}
.canvas{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;background:var(--paper);scroll-padding-top:64px}

/* ---------- document ---------- */
.doc{max-width:780px;margin:0 auto;padding:10px clamp(24px,6vw,84px) 45vh}
.title{display:block;width:100%;border:0;background:none;outline:none;resize:none;overflow:hidden;padding:0;margin:0 0 14px;font:700 calc(var(--doc-size) * 1.88)/1.3 var(--doc-font);letter-spacing:-.02em;color:var(--ink)}
.title::placeholder{color:var(--faint)}
.editor{outline:none;min-height:55vh;font:400 var(--doc-size)/1.85 var(--doc-font);color:var(--ink);overflow-wrap:anywhere;caret-color:var(--accent);position:relative}
.editor.is-empty::before{content:"开始写作…";position:absolute;color:var(--faint);pointer-events:none}
.doc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18vh 24px;color:var(--muted)}
.empty-icon-frame{width:72px;height:72px;display:grid;place-items:center;overflow:hidden;border-radius:21px;background:var(--accent-soft);margin-bottom:18px}
.empty-icon-frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.28)}
.doc-empty h2{font:600 19px var(--ui);letter-spacing:-.02em;color:var(--ink);margin:0 0 6px}
.doc-empty p{font-size:14px;line-height:1.7;margin:0 0 18px;color:var(--muted)}
.doc-empty .btn{height:38px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:600}

/* ---------- formatting toolbar (sticky) ---------- */
.editor-toolbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;flex-wrap:wrap;row-gap:2px;gap:4px;width:100%;min-width:0;margin:0 0 14px;padding:6px 0;background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow:visible;scrollbar-width:none}
.editor-toolbar::-webkit-scrollbar{display:none}
.toolbar-group{display:flex;align-items:center;flex:0 0 auto;gap:1px;padding:0 8px 0 0;margin-right:4px;border-right:1px solid var(--line)}
.toolbar-group:last-child{padding-right:0;margin-right:0;border-right:0}
.toolbar-separator{display:none}
.tool-btn{-webkit-appearance:none;appearance:none;display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);line-height:1;transition:background .12s,color .12s}
.tool-btn svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tool-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.tool-btn:active:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.tool-btn.is-active,.tool-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.tool-btn:disabled{opacity:.5;cursor:not-allowed}
.tool-btn.heading-btn{font:700 12px/1 var(--ui);letter-spacing:-.03em}
.tool-btn.heading-btn[data-block="h1"]{font-size:13.5px;font-weight:760}
.tool-btn.heading-btn[data-block="h3"]{font-size:11.5px}

/* ---------- editor blocks ---------- */
.blk{position:relative;min-height:1.85em;white-space:pre-wrap;margin:0}
.blk.p{margin:0 0 .15em}
.blk.h1,.blk.h2,.blk.h3,.blk.h4,.blk.h5,.blk.h6{font-weight:680;letter-spacing:-.02em;line-height:1.4}
.blk.h1{font-size:1.7em;margin:.8em 0 .2em}
.blk.h2{font-size:1.4em;margin:.8em 0 .2em}
.blk.h3{font-size:1.16em;margin:.85em 0 .2em}
.blk.h4{font-size:1em;margin:.85em 0 .15em}
.blk.h5,.blk.h6{font-size:.92em;margin:.75em 0 .15em;color:var(--muted)}
.blk.h1:first-child,.blk.h2:first-child,.blk.h3:first-child{margin-top:2px}
.blk.bullet,.blk.ordered,.blk.task{padding-left:1.6em}
.blk.bullet::before{content:"";position:absolute;left:.48em;top:.82em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.blk.ordered::before{content:attr(data-num) ".";position:absolute;left:.1em;color:var(--accent-text);font:650 .86em/2.15 var(--ui);font-variant-numeric:tabular-nums}
.blk.task{padding-left:1.9em}
.blk.task .taskbox{position:absolute;left:.1em;top:.5em}
.taskbox{position:relative;width:17px;height:17px;border:1.5px solid var(--faint);border-radius:5px;display:grid;place-items:center;background:transparent;flex-shrink:0;transition:background .12s,border-color .12s}
.taskbox::after{content:"";position:absolute;inset:-9px}
.taskbox:hover{border-color:var(--accent)}
.taskbox svg{width:11px;height:11px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.taskbox.done{background:var(--accent);border-color:var(--accent)}
.taskbox.done svg{opacity:1}
.blk.task:has(.taskbox.done){color:var(--muted)}
.blk.quote{padding:2px 0 2px 16px;border-left:3px solid var(--accent);color:var(--quote);margin:4px 0}
.blk.hr{border-top:1px solid var(--line);min-height:0;height:0;margin:20px 0}
.blk.code{position:relative;color:var(--ink);font:13.5px/1.7 var(--mono);background:var(--code-bg);border-radius:12px;padding:40px 16px 14px;margin:10px 0;white-space:pre-wrap;tab-size:4;overflow-wrap:anywhere}
.blk.code .code-lang,.blk.code .code-copy{position:absolute;top:7px;height:26px;display:inline-flex;align-items:center;gap:4px;padding:0 9px;border-radius:7px;font:600 11.5px/1 var(--ui);color:var(--muted);user-select:none;transition:background .12s,color .12s,opacity .12s}
.blk.code .code{display:block;min-height:1.7em}
.blk.code .code-lang{left:8px}
.blk.code .code-lang::before{content:attr(data-label)}
.blk.code .code-lang::after{content:"";width:6px;height:6px;margin:-3px 0 0 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.blk.code .code-copy{right:8px;opacity:0}
.blk.code .code-copy::before{content:"复制"}
.blk.code:hover .code-copy,.blk.code.active .code-copy{opacity:1}
.blk.code .code-lang:hover,.blk.code .code-copy:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
/* syntax colours: keywords follow the theme accent, the rest is a calm fixed set */
.blk.code .hljs-keyword,.blk.code .hljs-selector-tag,.blk.code .hljs-literal,.blk.code .hljs-doctag{color:var(--accent-text);font-weight:600}
.blk.code .hljs-string,.blk.code .hljs-regexp,.blk.code .hljs-addition,.blk.code .hljs-symbol{color:hsl(145 48% 30%)}
.blk.code .hljs-number,.blk.code .hljs-variable.constant_,.blk.code .hljs-bullet{color:hsl(24 80% 40%)}
.blk.code .hljs-title,.blk.code .hljs-title.function_,.blk.code .hljs-section{color:hsl(262 50% 48%)}
.blk.code .hljs-type,.blk.code .hljs-built_in,.blk.code .hljs-title.class_,.blk.code .hljs-selector-class{color:hsl(198 75% 32%)}
.blk.code .hljs-attr,.blk.code .hljs-attribute,.blk.code .hljs-property,.blk.code .hljs-params,.blk.code .hljs-variable,.blk.code .hljs-template-variable{color:hsl(33 70% 34%)}
.blk.code .hljs-comment,.blk.code .hljs-quote{color:var(--faint);font-style:italic}
.blk.code .hljs-meta,.blk.code .hljs-tag,.blk.code .hljs-name,.blk.code .hljs-punctuation{color:var(--muted)}
.blk.code .hljs-deletion{color:var(--danger)}
body.dark .blk.code .hljs-string,body.dark .blk.code .hljs-regexp,body.dark .blk.code .hljs-addition,body.dark .blk.code .hljs-symbol{color:hsl(140 45% 70%)}
body.dark .blk.code .hljs-number,body.dark .blk.code .hljs-variable.constant_,body.dark .blk.code .hljs-bullet{color:hsl(28 85% 70%)}
body.dark .blk.code .hljs-title,body.dark .blk.code .hljs-title.function_,body.dark .blk.code .hljs-section{color:hsl(265 75% 80%)}
body.dark .blk.code .hljs-type,body.dark .blk.code .hljs-built_in,body.dark .blk.code .hljs-title.class_,body.dark .blk.code .hljs-selector-class{color:hsl(192 70% 70%)}
body.dark .blk.code .hljs-attr,body.dark .blk.code .hljs-attribute,body.dark .blk.code .hljs-property,body.dark .blk.code .hljs-params,body.dark .blk.code .hljs-variable,body.dark .blk.code .hljs-template-variable{color:hsl(38 80% 72%)}
.code-lang-menu{width:220px;padding:6px}
.code-lang-menu .lang-filter{display:block;width:100%;height:34px;margin:0 0 4px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13.5px;outline:none}
.code-lang-menu .lang-filter:focus{border-color:var(--accent);background:var(--paper)}
.code-lang-menu .lang-list{max-height:280px;overflow-y:auto;overscroll-behavior:contain}
.code-lang-menu button.on{color:var(--accent-text);font-weight:650;background:var(--accent-soft)}
strong{font-weight:700}
em{font-style:italic}
del{color:var(--muted)}
u{text-decoration-thickness:1px;text-underline-offset:3px}
code{font:.86em var(--mono);color:var(--accent-text);background:var(--code-bg);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent-text);text-decoration:underline;text-underline-offset:2.5px;text-decoration-thickness:1px;cursor:pointer}
.mk{display:none}

/* ---------- images ---------- */
.blk.image-block{position:relative;display:block;width:fit-content;max-width:100%;margin:14px 0 18px;padding:0;line-height:0;overflow:visible;border-radius:10px;outline:2px solid transparent;outline-offset:3px;transition:outline-color .12s}
.blk.image-block img{display:block;width:auto;height:auto;max-width:100%;max-height:680px;object-fit:contain;border-radius:10px}
.blk.image-block:hover,.blk.image-block.is-selected,.blk.image-block:focus-visible{outline-color:var(--accent)}
.blk.image-block .image-delete{position:absolute;top:9px;right:9px;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--paper) 94%,transparent);color:var(--muted);box-shadow:0 2px 8px rgba(30,30,24,.14);font:550 12.5px var(--ui);line-height:1;opacity:0;pointer-events:none;transition:opacity .12s,color .12s}
.blk.image-block:hover .image-delete,.blk.image-block.is-selected .image-delete,.blk.image-block:focus-within .image-delete{opacity:1;pointer-events:auto}
.blk.image-block .image-delete svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.blk.image-block .image-delete:hover{color:var(--danger)}

/* ---------- math ---------- */
.blk.math-block{display:block;margin:12px 0;padding:14px 16px 10px;border-radius:12px;text-align:center;white-space:normal;cursor:pointer;user-select:none;transition:background .12s,box-shadow .12s}
.blk.math-block *{user-select:none}
.blk.math-block:hover{background:var(--code-bg)}
.math-preview{overflow-x:auto;overflow-y:hidden;max-width:100%;font-size:1.12em}
.math-preview .katex-display{margin:.2em 0}
.math-preview math{font-size:1.25em}
.math-caption{display:block;margin-top:4px;font:12px var(--ui);color:var(--faint);opacity:0;transition:opacity .12s}
.blk.math-block:hover .math-caption{opacity:1}
.math-editor-modal{width:min(680px,100%)}
.math-live-preview{display:flex;align-items:center;justify-content:center;min-height:110px;max-height:240px;overflow:auto;margin:10px 0 0;padding:18px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:1.25em;transition:opacity .15s}
.math-live-preview.stale{opacity:.45}
.math-live-preview .katex-display{margin:0}
.math-preview-empty{font:13px var(--ui);color:var(--faint)}
.math-error{margin:8px 0 0;padding:8px 11px;border-radius:8px;background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font:12.5px/1.5 var(--mono)}
.math-tabs{display:flex;gap:2px;margin:14px 0 8px;padding:3px;border-radius:10px;background:var(--hover);overflow-x:auto;scrollbar-width:none}
.math-tabs::-webkit-scrollbar{display:none}
.math-tabs button{flex:1 0 auto;height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.math-tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.math-palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px;max-height:164px;overflow-y:auto;padding:2px;overscroll-behavior:contain}
.math-key{display:grid;place-items:center;height:48px;padding:0 4px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);overflow:hidden;font-size:15px;transition:background .1s,border-color .1s}
.math-key:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.math-key .katex{font-size:.86em}
.math-key .katex-html{max-width:100%}
.math-source-wrap{position:relative;margin-top:12px}
.math-source{display:block;width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px 13px;font:14px/1.65 var(--mono);outline:none}
.math-source:focus{border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.math-suggest{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.math-suggest button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.math-suggest button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.math-suggest code{background:none;padding:0;color:var(--muted);font-size:12px}
.math-suggest .sg-glyph{min-width:18px;text-align:center}
.math-hint{margin:8px 0 0;font-size:12px;color:var(--faint)}
.math-hint kbd{font:11px var(--ui);padding:1px 5px;margin:0 1px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}

/* ---------- tables ---------- */
.blk.table{position:relative;display:block;margin:22px 0 18px;padding:0;white-space:normal}
.blk.table .table-tools{position:absolute;right:0;bottom:calc(100% + 6px);z-index:5;display:flex;align-items:center;gap:1px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 28px rgba(15,20,40,.14);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .14s,transform .14s}
.blk.table:focus-within .table-tools{opacity:1;pointer-events:auto;transform:none}
.blk.table .table-tools{font-family:var(--ui)}
.blk.table .table-action{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:7px;font:550 12.5px/1 var(--ui);color:var(--muted);white-space:nowrap}
.blk.table .table-action.icon-only{width:30px;padding:0;justify-content:center}
.blk.table .table-action.icon-only span{display:none}
.blk.table .table-action svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.blk.table .table-action:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.blk.table .table-action.danger:hover{color:var(--danger)}
.blk.table .table-action:disabled{opacity:.35;cursor:not-allowed}
.blk.table .table-tools-sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.blk.table .table-frame{display:grid;grid-template-columns:minmax(0,1fr) 22px;grid-template-rows:auto 22px;gap:4px}
.blk.table .table-scroll{grid-column:1;grid-row:1;overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
.blk.table .table-grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.92em;line-height:1.5;color:var(--ink)}
.blk.table .table-grid th,.blk.table .table-grid td{position:relative;padding:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);vertical-align:middle;transition:background .1s}
.blk.table .table-grid tr>:last-child{border-right:0}
.blk.table .table-grid tbody tr:last-child>*{border-bottom:0}
/* corner cells follow the frame's radius (11px frame − 1px border), so the
   selection ring and header tint are rounded too */
.blk.table .table-grid thead tr>:first-child{border-top-left-radius:10px}
.blk.table .table-grid thead tr>:last-child{border-top-right-radius:10px}
.blk.table .table-grid tbody tr:last-child>:first-child{border-bottom-left-radius:10px}
.blk.table .table-grid tbody tr:last-child>:last-child{border-bottom-right-radius:10px}
.blk.table .table-grid thead th{background:color-mix(in srgb,var(--accent-soft) 70%,var(--paper))}
.blk.table .table-grid tbody td:hover{background:color-mix(in srgb,var(--hover) 40%,var(--paper))}
.blk.table .table-grid :is(th,td):focus-within{background:color-mix(in srgb,var(--accent-soft) 45%,var(--paper));box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.blk.table .table-cell-input{display:block;width:100%;min-height:44px;margin:0;padding:10px 14px;border:0;border-radius:0;outline:none!important;background:transparent;color:inherit;font:inherit;text-align:inherit;text-overflow:ellipsis;-webkit-appearance:none;appearance:none}
.blk.table thead .table-cell-input{font-weight:650}
.blk.table .table-cell-input::placeholder{color:var(--faint);font-weight:400}
.blk.table .table-add{display:grid;place-items:center;border-radius:8px;color:var(--faint);opacity:0;transition:opacity .14s,background .12s,color .12s}
.blk.table .table-add svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.blk.table .table-add-col{grid-column:2;grid-row:1}
.blk.table .table-add-row{grid-column:1;grid-row:2}
.blk.table:hover .table-add,.blk.table:focus-within .table-add{opacity:1}
.blk.table .table-add:hover{background:var(--accent-soft);color:var(--accent-text)}

/* ---------- dialogs ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(24,26,20,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .14s ease-out}
.modal{width:min(500px,100%);max-height:min(88dvh,760px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(20,24,14,.28);padding:22px 24px 22px;outline:none;animation:pop .18s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal-head h2{font:620 20px/1.2 var(--ui);letter-spacing:-.03em;margin:0;flex:1}
.modal-close{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);margin-right:-8px}
.modal-close:hover{background:var(--hover);color:var(--ink)}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.section{padding:18px 0;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0;padding-top:8px}
.section:last-of-type{padding-bottom:4px}
.section-title{font:650 14px var(--ui);margin:0 0 4px}
.help{font-size:12.5px;line-height:1.65;color:var(--muted);margin:0 0 12px}
.field-label{display:block;font-size:12.5px;font-weight:550;color:var(--muted);margin:10px 0 6px}
.field{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 11px;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{background:var(--paper);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
select.field{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check-row{display:flex;align-items:flex-start;gap:9px;margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--muted);cursor:pointer}
.check-row input{accent-color:var(--accent);width:16px;height:16px;margin:1px 0 0;flex-shrink:0}
.switch-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;cursor:pointer}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch{width:42px;height:25px;border-radius:13px;background:color-mix(in srgb,var(--faint) 45%,var(--line));position:relative;transition:background .15s;flex-shrink:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s}
.switch-row input:checked+.switch{background:var(--accent)}
.switch-row input:checked+.switch::after{transform:translateX(17px)}
.switch-row input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{height:36px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--hover);color:var(--ink)}
.btn.ghost:hover{filter:brightness(.97)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,transparent)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal-status{font-size:12.5px;line-height:1.6;color:var(--muted);margin:10px 0 0;min-height:1.2em}
.modal-status.ok{color:var(--ok)}
.modal-status.err{color:var(--danger)}
.font-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 4px}
.font-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;height:66px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper)}
.font-choice b{font-size:20px;font-weight:600;line-height:1.2}
.font-choice span{font:12px var(--ui);color:var(--muted)}
.font-choice:hover{background:var(--hover)}
.font-choice.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.font-choice.selected span{color:var(--accent-text)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--hover)}
.seg button{height:30px;min-width:52px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.selected{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.animal-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:10px 0 14px}
.animal-choice{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:7px 2px;border:1px solid transparent;border-radius:10px;color:var(--muted);font-size:12px}
.animal-art{display:block;width:min(100%,50px);aspect-ratio:1;overflow:hidden;border-radius:12px}
.animal-choice img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.28);border-radius:12px}
.animal-choice:hover{background:var(--hover)}
.animal-choice.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink)}
.animal-choice.selected .animal-art{outline:2px solid var(--accent);outline-offset:1px}

/* note action menu (dialog) */
.menu{width:min(320px,100%);padding:8px}
.menu-title{font-size:12px;color:var(--faint);padding:9px 12px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:9px;font-size:14px;text-align:left;color:var(--ink)}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.menu-item.danger{color:var(--danger)}
.menu-item.danger svg{stroke:var(--danger)}

/* pointer context menu */
.context-menu{position:fixed;z-index:100;width:220px;padding:5px;background:var(--paper);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 40px rgba(20,24,14,.2);color:var(--ink);animation:pop .12s var(--ease)}
.context-menu-title{font-size:12px;color:var(--faint);padding:7px 10px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.context-menu button{display:flex;align-items:center;width:100%;height:34px;padding:0 10px;border-radius:7px;text-align:left;font-size:13.5px;color:var(--ink)}
.context-menu button:hover,.context-menu button:focus-visible{background:var(--hover)}
.context-menu .danger{color:var(--danger)}
.context-menu hr{border:0;border-top:1px solid var(--line);margin:4px 3px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#2a2d26;color:#f4f5ee;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
body.dark .toast{background:#e9ebe0;color:#1c1f18}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   Responsive
   ============================================================ */
@media (hover:none){.search-wrap kbd{display:none}.search{padding-right:12px}.blk.table .table-add{opacity:1}}

/* compact: icon rail + list */
@media (max-width:1120px) and (min-width:761px){
  .app{grid-template-columns:68px 290px minmax(0,1fr)}
  .sidebar{padding-inline:9px}
  .sidebar-head{justify-content:center;padding:0 0 26px}
  .brand-name,.nav-section-label,.nav-item span:not(.nav-count){display:none}
  .nav-item{justify-content:center;padding:0;gap:0;min-height:42px;position:relative}
  .nav-item .nav-count{display:none}
  .sidebar-bottom{flex-direction:column;justify-content:center;padding:10px 0 0}
  .nav-group-head,.nav-empty,.nav-empty-text{display:none}
  .nav-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .nav-group.collapsed .nav-list{display:grid}
  .nav-group:not(:has(.nav-item)){display:none}
  .app.nav-collapsed{grid-template-columns:68px 290px minmax(0,1fr)}
  .app.nav-collapsed .sidebar{visibility:visible;padding-inline:9px}
  .nav-toggle{display:none}
  .nav-item{padding:0}
  .doc{padding-inline:clamp(24px,4vw,56px)}
}

/* phone: drawers */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(272px,84vw);z-index:33;transform:translateX(-102%);transition:transform .2s var(--ease),visibility 0s linear .2s;box-shadow:18px 0 48px rgba(0,0,0,.18);visibility:hidden}
  .note-sidebar{position:fixed;inset:0 auto 0 0;width:min(380px,92vw);z-index:32;transform:translateX(-102%);transition:transform .2s var(--ease),visibility 0s linear .2s;box-shadow:18px 0 48px rgba(0,0,0,.14);border:0;visibility:hidden}
  .app.sidebar-open .sidebar,.app.list-open .note-sidebar{transform:translateX(0);visibility:visible;transition:transform .2s var(--ease),visibility 0s}
  .overlay{display:block;position:fixed;inset:0;background:rgba(20,22,16,.38);z-index:31;opacity:0;pointer-events:none;transition:opacity .2s}
  .app.sidebar-open .overlay,.app.list-open .overlay{opacity:1;pointer-events:auto}
  .main{grid-column:1;grid-row:1;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .sidebar,.note-sidebar{padding-left:max(12px,env(safe-area-inset-left))}
  .nav-toggle-btn,.back-btn{display:grid}
  .nav-toggle{display:none}
  .topbar{padding-inline:8px;gap:2px}
  .status{margin-right:4px;font-size:12px;max-width:34vw}
  .icon-btn{width:40px;height:40px}
  .doc{padding:6px 20px 50vh}
  .title{font-size:calc(var(--doc-size) * 1.66);margin-bottom:10px}
  .editor-toolbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin-inline:-20px;width:calc(100% + 40px);padding:6px 20px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .tool-btn{flex-basis:40px;width:40px;height:40px}
  .sync-state{display:none}
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{width:100%;max-width:none;max-height:88dvh;border-radius:18px 18px 0 0;border-bottom:0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:sheet .22s var(--ease)}
  .math-editor-modal{padding:20px 16px calc(22px + env(safe-area-inset-bottom))}
  .math-live-preview{min-height:88px}
  .math-palette{grid-template-columns:repeat(auto-fill,minmax(50px,1fr));max-height:150px}
  .math-hint{display:none}
  .menu{width:100%;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
  .menu-item{height:48px;font-size:15px}
  .blk.image-block .image-delete{opacity:1;pointer-events:auto}
  .math-caption{opacity:.8}
  .blk.table .table-action{height:36px;width:36px;padding:0;justify-content:center}
  .blk.table .table-action span{display:none}
  .blk.table .table-add{opacity:1}
  .search,.field,.math-source,.table-cell-input{font-size:16px}
  .field-row{grid-template-columns:1fr}
  .animal-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .font-choice b{font-size:18px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@supports (height:100lvh){
  /* reach under the floating Safari toolbar instead of stopping above it */
  @media (max-width:760px){.app{bottom:auto;height:100lvh}}
}
html.standalone{height:calc(100% + var(--viewport-gap, 0px))}
html.standalone .app{height:auto;bottom:calc(-1 * var(--viewport-gap, 0px))}
html.standalone .sidebar,html.standalone .note-sidebar,html.standalone .overlay,html.standalone .modal-backdrop{bottom:calc(-1 * var(--viewport-gap, 0px))}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
@media (pointer:coarse){
  .nav-item{min-height:46px}
  .note-item{padding-block:13px}
  .bottom-btn{width:44px;height:44px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>

function fmtDate(t) {
  if (!t) return '刚刚';
  const d = new Date(t);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yest = new Date(now.getTime() - 864e5).toDateString() === d.toDateString();
  const hm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (sameDay) return hm;
  if (yest) return '昨天 ' + hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function loadLocal() {

    state.notes = Array.isArray(raw) ? raw : defaultNotes();
  } catch (e) {
    state.notes = defaultNotes();
  }
  try {
    const prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    state.dark = typeof prefs.dark === 'boolean' ? prefs.dark : window.matchMedia('(prefers-color-scheme: dark)').matches;
    state.repo = prefs.repo || state.repo;
    state.dir = prefs.dir || state.dir;
    state.animal = ANIMALS.some((a) => a[0] === prefs.animal) ? prefs.animal : 'owl';
    if (SYNC_CHOICES.some((c) => c[0] === prefs.syncInterval)) state.syncInterval = prefs.syncInterval;
    if (DOC_FONTS[prefs.docFont]) state.docFont = prefs.docFont;
    if (DOC_SIZES[prefs.docSize]) state.docSize = prefs.docSize;
    if (Array.isArray(prefs.folders)) state.folders = prefs.folders.filter((f) => typeof f === 'string' && f);

    if (prefs.collapsedGroups && typeof prefs.collapsedGroups === 'object') state.collapsedGroups = prefs.collapsedGroups;
  } catch (e) { /* ignore */ }
  state.syncMeta = loadSyncMeta();
}

function noteExcerpt(n) {
  const s = String(n.body || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/<!--[\s\S]*?-->/g, ' ')
    .replace(/!\[[^\]]*\]\((?:data:image\/[^)]+|https?:\/\/[^)]+)\)/g, ' [图片] ')
    .replace(/[#>*_`~[\]()!-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return s.slice(0, 110) || '空白笔记';
}

function noteMatch(n) {
  if (state.view === 'trash') {
    if (!n.deletedAt) return false;
  } else if (n.deletedAt) {
    return false;
  }
  if (state.view === 'favorites' && !n.favorite) return false;
  if (state.view === 'today' && !isRecent(n)) return false;
  if (state.view.startsWith('folder:') && (n.folder || '') !== state.view.slice(7)) return false;
  if (state.view.startsWith('tag:') && !noteTags(n).has(state.view.slice(4))) return false;
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  return ((n.title || '') + '\n' + (n.body || '') + '\n' + ((n.tags || []).join(' '))).toLowerCase().includes(q);
}

function filteredNotes() {
  const list = state.notes.filter(noteMatch);
  list.sort((a, b) => {
    if (state.view !== 'trash' && !!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  return list;
}

/* ---------- markdown: blocks ---------- */
function parseImageMarkdown(raw) {
  const match = String(raw || '').trim().match(/^!\[([^\]\n]*)\]\((data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+|https?:\/\/[^\s)]+)\)$/i);
  return match ? { alt: match[1], src: match[2] } : null;
}

function blockType(line) {
  if (!line.trim()) return 'blank';
  if (parseImageMarkdown(line)) return 'image';
  let m;
  if ((m = line.match(/^(#{1,6})\s+/))) return 'h' + m[1].length;
  if (/^\s*[-*+]\s+\[[ xX]\]\s+/.test(line)) return 'task';
  if (/^\s*[-*+]\s+/.test(line)) return 'bullet';
  if (/^\s*\d+\.\s+/.test(line)) return 'ordered';
  if (/^\s*>\s?/.test(line)) return 'quote';
  if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) return 'hr';
  return 'p';
}

function latexToMathML(source) {
  const greek={alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',phi:'φ',omega:'ω',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Omega:'Ω'};
  const ops={times:'×',cdot:'·',div:'÷',pm:'±',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',approx:'≈',equiv:'≡',infty:'∞',sum:'∑',prod:'∏',int:'∫',to:'→',rightarrow:'→',leftarrow:'←',partial:'∂',nabla:'∇',forall:'∀',exists:'∃',in:'∈',notin:'∉',cup:'∪',cap:'∩',cdots:'⋯'};
  const esc=v=>escapeHtml(v);let i=0;const input=String(source||'');
  function group(){while(i<input.length&&/\s/.test(input[i]))i++;if(input[i]==='{'){i++;const v=sequence('}');if(input[i]==='}')i++;return '<mrow>'+v+'</mrow>';}return atom();}
  function atom(){
    while(i<input.length&&/\s/.test(input[i]))i++;if(i>=input.length)return '<mrow></mrow>';
    let value='',ch=input[i];
    if(ch==='\\'){i++;const start=i;while(i<input.length&&/[A-Za-z]/.test(input[i]))i++;const cmd=input.slice(start,i);
      if(!cmd&&i<input.length)value='<mo>'+esc(input[i++])+'</mo>';
      else if(cmd==='frac'){const a=group(),b=group();value='<mfrac>'+a+b+'</mfrac>';}
      else if(cmd==='sqrt')value='<msqrt>'+group()+'</msqrt>';
      else if(cmd==='text'||cmd==='mathrm'||cmd==='mathbf')value='<mstyle mathvariant="'+(cmd==='mathbf'?'bold':'normal')+'">'+group()+'</mstyle>';
      else if(greek[cmd])value='<mi>'+greek[cmd]+'</mi>';
      else if(ops[cmd])value='<mo>'+ops[cmd]+'</mo>';
      else if(['left','right','displaystyle','textstyle','quad','qquad',',',';','!'].includes(cmd))value='';
      else value='<mi>'+esc(cmd)+'</mi>';
    }else if(ch==='{')value=group();
    else if(/[0-9]/.test(ch)){const m=input.slice(i).match(/^\d+(?:\.\d+)?/)[0];i+=m.length;value='<mn>'+m+'</mn>';}
    else if(/[A-Za-z]/.test(ch)){const m=input.slice(i).match(/^[A-Za-z]+/)[0];i+=m.length;value='<mi>'+esc(m)+'</mi>';}
    else{i++;value=ch===' '?' <mspace width="0.25em"/>':'<mo>'+esc(ch)+'</mo>';}
    let sub='',sup='';while(input[i]==='_'||input[i]==='^'){const k=input[i++],v=group();if(k==='_')sub=v;else sup=v;}
    if(sub&&sup)value='<msubsup>'+value+sub+sup+'</msubsup>';else if(sub)value='<msub>'+value+sub+'</msub>';else if(sup)value='<msup>'+value+sup+'</msup>';return value;
  }
  function sequence(stop){const out=[];while(i<input.length&&input[i]!==stop){const before=i;out.push(atom());if(i===before)i++;}return out.join('');}
  return sequence('');
}
function mathExpression(raw){const one=String(raw||'').trim().match(/^\$\$([^\n]+?)\$\$$/);if(one)return one[1].trim();const lines=String(raw||'').split('\n');if(lines.length&&/^\s*\$\$\s*$/.test(lines[0]))lines.shift();if(lines.length&&/^\s*\$\$\s*$/.test(lines[lines.length-1]))lines.pop();return lines.join('\n').trim();}
function isTableLine(line){return /^\s*\|.*\|\s*$/.test(line)&&(line.match(/\|/g)||[]).length>=3;}
function splitMarkdownTableRow(line) {
  let value = String(line || '').trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  const cells = [];
  let cell = '';
  let escaped = false;
  for (let i = 0; i < value.length; i++) {
    const ch = value[i];
    if (ch === '|' && !escaped) {
      cells.push(cell.trim());
      cell = '';
      continue;
    }
    cell += ch;
    if (ch === '\\' && !escaped) escaped = true;
    else escaped = false;
  }
  cells.push(cell.trim());
  return cells;
}

function parseMarkdownTable(raw) {
  const lines = String(raw || '').split('\n').filter((line) => line.trim());
  let cells = lines.map(splitMarkdownTableRow);
  if (!cells.length) cells = [['标题 1','标题 2'],['内容','内容']];
  const separatorIndex = cells.length > 1 && cells[1].every((cell) => /^:?-{3,}:?$/.test(cell)) ? 1 : -1;
  const columnCount = Math.max(1, ...cells.filter((_, i) => i !== separatorIndex).map((row) => row.length));
  const align = separatorIndex >= 0
    ? cells[separatorIndex].map((cell) => cell.startsWith(':') && cell.endsWith(':') ? 'center' : cell.endsWith(':') ? 'right' : 'left')
    : [];
  const rows = cells.filter((_, i) => i !== separatorIndex).map((row) => {
    const next = row.slice(0, columnCount);
    while (next.length < columnCount) next.push('');
    return next;
  });
  if (!rows.length) rows.push(Array(columnCount).fill(''));
  if (!align.length) align.push(...Array(columnCount).fill('left'));
  while (align.length < columnCount) align.push('left');
  return { rows, align:align.slice(0,columnCount) };
}

function serializeMarkdownTable(model) {
  const rows = (model.rows || []).map((row) => {
    const cells = row.map((value) => String(value == null ? '' : value).replace(/\r?\n/g,' ').replace(/\|/g,'\\|').trim());
    return '| ' + cells.join(' | ') + ' |';
  });
  const columns = Math.max(1, ...((model.rows || []).map((row) => row.length)));
  const align = (model.align || []).slice();
  while (align.length < columns) align.push('left');
  const separator = '| ' + align.slice(0,columns).map((side) => side === 'center' ? ':---:' : side === 'right' ? '---:' : ':---').join(' | ') + ' |';
  if (!rows.length) rows.push('| ' + Array(columns).fill('').join(' | ') + ' |');
  rows.splice(1, 0, separator);
  return rows.join('\n');
}

function splitBlocks(md) {
  const lines = md.split('\n');
  const blocks = [];
  let off = 0;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const fence = line.trim().slice(0, 3);
      const closeRe = new RegExp('^\\s*' + fence.replace(/`/g, '\\`') + '\\s*$');
      let j = i + 1;
      let closed = false;
      while (j < lines.length) {
        if (closeRe.test(lines[j])) { closed = true; break; }
        j++;
      }
      const end = closed ? j : lines.length - 1;
      const raw = lines.slice(i, end + 1).join('\n');
      blocks.push({ raw, start: off, type: 'code', closed });
      off += raw.length + 1;
      i = end + 1;
      continue;
    }
    if (/^\s*\$\$[^$\n]+\$\$\s*$/.test(line)) { blocks.push({raw:line,start:off,type:'math',closed:true}); off+=line.length+1; i++; continue; }
    if (/^\s*\$\$\s*$/.test(line)) {
      let j=i+1;while(j<lines.length&&!/^\s*\$\$\s*$/.test(lines[j]))j++;
      const closed=j<lines.length,end=closed?j:lines.length-1,raw=lines.slice(i,end+1).join('\n');
      blocks.push({raw,start:off,type:'math',closed});off+=raw.length+1;i=end+1;continue;
    }
    if (isTableLine(line)&&i+1<lines.length&&isTableLine(lines[i+1])) {
      let j=i+1;while(j<lines.length&&isTableLine(lines[j]))j++;
      const raw=lines.slice(i,j).join('\n');blocks.push({raw,start:off,type:'table'});off+=raw.length+1;i=j;continue;
    }
    blocks.push({ raw: line, start: off, type: blockType(line) });
    off += line.length + 1;
    i++;
  }
  return blocks;
}

function blockIndexAt(blocks, offset) {
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (offset <= b.start + b.raw.length) return i;
  }
  return blocks.length - 1;
}

function splitPrefix(type, raw) {
  let m;
  if (type.startsWith('h')) {
    m = raw.match(/^(#{1,6}\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  if (type === 'bullet') {
    m = raw.match(/^(\s*[-*+]\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  if (type === 'task') {
    m = raw.match(/^(\s*[-*+]\s+\[)([ xX])(\]\s+)/);
    if (m) return { marker: m[0], text: raw.slice(m[0].length), stateAt: m[1].length, done: m[2].toLowerCase() === 'x' };
  }
  if (type === 'ordered') {
    m = raw.match(/^(\s*\d+\.\s+)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length), num: m[1].trim().replace(/\.$/, '') };
  }
  if (type === 'quote') {
    m = raw.match(/^(\s*>\s?)/);
    if (m) return { marker: m[1], text: raw.slice(m[1].length) };
  }
  return { marker: '', text: raw };
}

/* ---------- markdown: inline ---------- */
function inlineHtml(text) {
  let out = '';
  let i = 0;
  while (i < text.length) {
    const rest = text.slice(i);
    let m;
    if (rest[0] === '\\' && /[\\`*_{}[\]()#+\-.!>~]/.test(rest[1] || '')) {
      out += escapeHtml(rest.slice(0, 2));
      i += 2;
      continue;
    }
    if ((m = rest.match(/^`([^`\n]+)`/))) {
      out += '<code><span class="mk">`</span>' + escapeHtml(m[1]) + '<span class="mk">`</span></code>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^(\*\*|__)([^\n]+?)\1/))) {
      out += '<strong><span class="mk">' + escapeHtml(m[1]) + '</span>' + inlineHtml(m[2]) + '<span class="mk">' + escapeHtml(m[1]) + '</span></strong>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^(\*|_)([^\n]+?)\1/))) {
      out += '<em><span class="mk">' + escapeHtml(m[1]) + '</span>' + inlineHtml(m[2]) + '<span class="mk">' + escapeHtml(m[1]) + '</span></em>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^\+\+([^\n]+?)\+\+/))) {
      out += '<u><span class="mk">++</span>' + inlineHtml(m[1]) + '<span class="mk">++</span></u>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^~~([^\n]+?)~~/))) {
      out += '<del><span class="mk">~~</span>' + inlineHtml(m[1]) + '<span class="mk">~~</span></del>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^\[([^\]\n]+)\]\(([^)\s]+)\)/))) {
      if (/^(https?:|mailto:)/i.test(m[2])) {
        out += '<a href="' + escapeHtml(m[2]) + '" target="_blank" rel="noopener noreferrer"><span class="mk">[</span>' + escapeHtml(m[1]) + '<span class="mk">](' + escapeHtml(m[2]) + ')</span></a>';
      } else {
        out += escapeHtml(m[0]);
      }
      i += m[0].length;
      continue;
    }
    if (rest[0] === '#' && (i === 0 || /[\s(（，。、；：,.;:!?！？"'“”]/.test(text[i - 1])) && (m = rest.match(/^#([^\s#.,;:!?，。；：！？、()（）\[\]{}<>"'`“”‘’*~|\\/]{1,40})/)) && !/^#\d+$/.test(m[0])) {
      out += '<span class="tag" data-tag="' + escapeHtml(m[1]) + '">' + escapeHtml(m[0]) + '</span>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(/^https?:\/\/[^\s<>()"']+/))) {
      out += '<a href="' + escapeHtml(m[0]) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(m[0]) + '</a>';
      i += m[0].length;
      continue;
    }
    out += escapeHtml(rest[0]);
    i++;
  }
  return out;
}

/* ---------- markdown: render ---------- */
function renderBlock(b, active, index) {
  const cls = 'blk ' + b.type + (active ? ' active' : '');
  const attrs = ' data-i="' + index + '"';
  if (b.type === 'blank') return '<div class="' + cls + '"' + attrs + '><br></div>';
  if (b.type === 'table') return renderTableBlock(b, active, index);
  if (b.type === 'math') {
    ensureKatex();
    const expr=mathExpression(b.raw);
    return '<div class="' + cls + ' math-block" contenteditable="false"' + attrs + ' data-raw="' + escapeHtml(b.raw) + '">' +
      '<div class="math-preview">' + renderTex(expr, true) + '</div>' +
      '<span class="math-caption">公式 · 点击编辑 LaTeX</span></div>';
  }
  if (b.type === 'image') {
    const image = parseImageMarkdown(b.raw);
    if (!image) return '<div class="' + cls + '"' + attrs + '>' + escapeHtml(b.raw) + '</div>';
    return '<div class="' + cls + ' image-block" contenteditable="false" tabindex="0" role="group" aria-label="图片：' + escapeHtml(image.alt || '未命名') + '"' + attrs + ' data-raw="' + escapeHtml(b.raw) + '">' +
      '<img src="' + escapeHtml(image.src) + '" alt="' + escapeHtml(image.alt) + '" loading="lazy" draggable="false">' +
      '<button type="button" class="image-delete" data-delete-image title="删除图片" aria-label="删除图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>删除</span></button>' +
      '</div>';
  }
  if (b.type === 'code') {
    const lines = b.raw.split('\n');
    const lang = codeLang(b.raw);
    const open = '<div class="' + cls + '"' + attrs + ' data-lang="' + escapeHtml(lang) + '">' + codeBlockChrome(lang, b.closed && lines.length > 1);
    if (!b.closed) {
      const rest = lines.slice(1);
      const opening = rest.length ? lines[0] + '\n' : lines[0];
      return open + '<span class="mk">' + escapeHtml(opening) + '</span><span class="code">' + highlightCode(rest.join('\n'), lang) + '</span></div>';
    }
    if (lines.length === 1) return open + '<span class="mk">' + escapeHtml(lines[0]) + '</span></div>';
    const middle = lines.slice(1, -1);
    const closing = (middle.length ? '\n' : '') + lines[lines.length - 1];
    return open + '<span class="mk">' + escapeHtml(lines[0] + '\n') + '</span><span class="code">' + highlightCode(middle.join('\n'), lang) + '</span><span class="mk">' + escapeHtml(closing) + '</span></div>';
  }
  if (b.type === 'hr') return '<div class="' + cls + '"' + attrs + '><span class="mk">' + escapeHtml(b.raw) + '</span></div>';

  const p = splitPrefix(b.type, b.raw);
  const marker = p.marker ? '<span class="mk">' + escapeHtml(p.marker) + '</span>' : '';
  let extra = '';
  if (b.type === 'task') {
    extra = '<button class="taskbox' + (p.done ? ' done' : '') + '" contenteditable="false" tabindex="-1" data-task="' + (b.start + p.stateAt) + '" aria-label="切换完成状态"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></button>';
  }
  const inner = inlineHtml(p.text);
  // An empty item only holds hidden markup; the <br> gives the caret a visible place to live.
  return '<div class="' + cls + '"' + attrs + (p.num ? ' data-num="' + escapeHtml(p.num) + '"' : '') + '>' + marker + extra + (inner || '<br>') + '</div>';
}

function renderDoc(opts) {
  const o = opts || {};
  const note = currentNote();
  if (!note) {
      editor.innerHTML = '';
    editor.classList.remove('is-empty');
    updateToolbarState();
    return;
  }
  const md = note.body || '';
  const blocks = splitBlocks(md);
  let active = -1;
  const focused = o.focus === true || document.activeElement === editor;
  if (typeof o.caret === 'number' && focused) active = blockIndexAt(blocks, o.caret);
  editor.classList.toggle('is-empty', md === '');
  editor.innerHTML = blocks.map((b, i) => renderBlock(b, i === active, i)).join('');
  if (typeof o.caret === 'number' && focused) {
    setCaret(o.caret);
    focusEditor();
  }
  updateToolbarState();
}

function inlineFormatRanges(line, kind) {
  const backtick = String.fromCharCode(96);
  const patterns = {
    bold: /(\*\*|__)(.+?)\1/g,
    italic: /(^|[^*])\*([^*\n]+)\*(?!\*)|(^|[^_])_([^_\n]+)_(?!_)/g,
    underline: /\+\+([^+\n]+)\+\+/g,
    strike: /~~([^~\n]+)~~/g,
    code: new RegExp(backtick+'([^'+backtick+'\n]+)'+backtick,'g'),
    link: /\[([^\]\n]+)\]\(([^)\s]+)\)/g
  };
  const re = patterns[kind];
  if (!re) return [];
  const ranges = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(line))) {
    if (kind === 'bold') {
      ranges.push({start:m.index + 2, end:m.index + 2 + m[2].length});
    } else if (kind === 'italic') {
      if (m[2] != null) ranges.push({start:m.index + m[1].length + 1, end:m.index + m[1].length + 1 + m[2].length});
      else if (m[4] != null) ranges.push({start:m.index + m[3].length + 1, end:m.index + m[3].length + 1 + m[4].length});
    } else if (kind === 'link') {
      ranges.push({start:m.index + 1, end:m.index + 1 + m[1].length});
    } else {
      const content = m[1];
      const delimiter = kind === 'underline' || kind === 'strike' ? 2 : 1;
      ranges.push({start:m.index + delimiter, end:m.index + delimiter + content.length});
    }
    if (!m[0].length) re.lastIndex++;
  }
  return ranges;
}

function toolbarRangeActive(ranges, start, end) {
  return ranges.some((r) => start === end
    ? start >= r.start && start <= r.end
    : start >= r.start && end <= r.end);
}

function updateToolbarState() {
  const toolbar = $('editor-toolbar');
  if (!toolbar) return;
  const note = currentNote();
  const focused = document.activeElement === editor || editor.contains(document.activeElement);
  const sel = focused ? selectionOffsets() : null;
  const caret = focused ? caretOffset() : null;
  const point = sel ? sel.start : (caret == null ? null : caret);
  const md = note ? note.body || '' : '';
  const blocks = note ? splitBlocks(md) : [];
  const firstIndex = point == null || !blocks.length ? -1 : blockIndexAt(blocks, point);
  const lastPoint = sel && sel.end > sel.start ? sel.end - 1 : point;
  const lastIndex = lastPoint == null || !blocks.length ? firstIndex : blockIndexAt(blocks, lastPoint);
  const sameBlock = firstIndex >= 0 && firstIndex === lastIndex;
  const block = sameBlock ? blocks[firstIndex] : null;
  const selectedBlocks = firstIndex >= 0 && lastIndex >= firstIndex ? blocks.slice(firstIndex, lastIndex + 1) : [];
  const supportedBlockTypes = (type) => type === 'blank' || type === 'p' || /^h[1-6]$/.test(type) || ['bullet','ordered','task','quote'].includes(type);
  const supportedSelection = selectedBlocks.length > 0 && selectedBlocks.every((item) => supportedBlockTypes(item.type));
  const unsupportedBlock = !supportedSelection;
  const start = sel ? sel.start : point;
  const end = sel ? sel.end : point;
  const sameLine = start == null || end == null || md.slice(start, end).indexOf('\n') < 0;
  const inlineActive = {};

  if (block && start != null && end != null && sameLine && !unsupportedBlock) {
    const lineStart = md.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
    const lineEndAt = md.indexOf('\n', start);
    const lineEnd = lineEndAt < 0 ? md.length : lineEndAt;
    const line = md.slice(lineStart, lineEnd);
    const localStart = Math.max(0, start - lineStart);
    const localEnd = Math.max(0, end - lineStart);
    for (const kind of ['bold','italic','underline','strike','code','link']) {
      inlineActive[kind] = toolbarRangeActive(inlineFormatRanges(line, kind), localStart, localEnd);
    }
  }

  const blockKinds = new Set();
  if (supportedSelection) {
    const types = new Set(selectedBlocks.map((item) => item.type));
    if (types.size === 1) {
      const type = selectedBlocks[0].type;
      if (/^h[1-6]$/.test(type)) blockKinds.add(type);
      if (['bullet','ordered','task','quote'].includes(type)) blockKinds.add(type);
    }
  }
  const canEdit = !!note && focused;
  toolbar.querySelectorAll('.tool-btn').forEach((button) => {
    const format = button.dataset.format;
    const kind = button.dataset.block;
    const isBlockTool = !!kind;
    const isInlineTool = !!format;
    const enabled = canEdit && supportedSelection && (!isInlineTool || sameLine);
    const active = format ? !!inlineActive[format] : kind ? blockKinds.has(kind) : false;
    button.disabled = !enabled;
    button.classList.toggle('is-active', active);
    button.setAttribute('aria-pressed', String(active));
    if (!enabled) button.setAttribute('aria-disabled','true');
    else button.removeAttribute('aria-disabled');
  });
}

function updateActive() {
  const note = currentNote();
  if (note) {
    const off = caretOffset();
    if (off != null) {
      const blocks = splitBlocks(note.body || '');
      const idx = blockIndexAt(blocks, off);
      blockEls().forEach((el, i) => el.classList.toggle('active', i === idx));
    }
  }
  updateToolbarState();
}

/* ---------- caret & selection ---------- */
function blockEls() {
  return Array.from(editor.children).filter((el) => el.classList.contains('blk'));
}

function textOffsetWithin(root, node, offset) {
  if (node === root) {
    let acc = 0;
    const kids = Array.from(node.childNodes).slice(0, offset);
    for (const k of kids) acc += k.textContent.length;
    return acc;
  }
  if (node.nodeType === 3) {
    let acc = 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode === node) return acc + offset;
      acc += walker.currentNode.nodeValue.length;
    }
    return acc;
  }
  let acc = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n === node) {
      const kids = Array.from(node.childNodes).slice(0, offset);
      for (const k of kids) acc += k.textContent.length;
      return acc;
    }
    if (n.nodeType === 3) acc += n.nodeValue.length;
  }
  const kids = Array.from(node.childNodes).slice(0, offset);
  for (const k of kids) acc += k.textContent.length;
  return acc;
}

function blockSourceText(el) {
  if (!el) return '';
  if (el.classList.contains('math-block') || el.classList.contains('image-block')) return el.dataset.raw || '';
  if (el.classList.contains('table-widget')) return el.dataset.raw || '';
  return el.textContent;
}
function caretOffset() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.startContainer)) return null;
  if (r.startContainer === editor) {
    let off = 0;
    const kids = Array.from(editor.childNodes).slice(0, r.startOffset);
    for (const k of kids) off += blockSourceText(k).length + 1;
    return off;
  }
  let off = 0;
  for (const b of blockEls()) {
    if (b === r.startContainer || b.contains(r.startContainer)) {
      return off + textOffsetWithin(b, r.startContainer, r.startOffset);
    }
    off += blockSourceText(b).length + 1;
  }
  return off;
}

function setCaret(offset) {
  const blocks=blockEls();
  if(!blocks.length)return;
  const off=Math.max(0,offset);
  let acc=0;
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i],len=blockSourceText(b).length;
    if(off<=acc+len){
      if(b.classList.contains('math-block') || b.classList.contains('image-block')){
        if(blocks[i+1])placeCaretInBlock(blocks[i+1],0);
        else placeRangeAt(editor,i+1);
      }else placeCaretInBlock(b,off-acc);
      return;
    }
    acc+=len+1;
  }
  const last=blocks[blocks.length-1];
  if(last.classList.contains('math-block') || last.classList.contains('image-block'))placeRangeAt(editor,blocks.length);

  if (n.deletedAt) {
    if (!confirm('永久删除这篇笔记？此操作无法撤销。')) return;
    state.notes = state.notes.filter((x) => x.id !== n.id);
    if (!state.syncMeta.deleted.includes(n.id)) state.syncMeta.deleted.push(n.id);
    saveSyncMeta();
    const next = filteredNotes()[0];
    state.currentId = next ? next.id : null;
    toast('已永久删除');
  } else {
    n.deletedAt = Date.now();
    n.updatedAt = Date.now();
    const next = filteredNotes().find((x) => x.id !== n.id);
    state.currentId = next ? next.id : null;
    toast('已移到最近删除');
  }
  saveLocal();
  closeModal();
  renderAll();
  scheduleSync();
}

function restoreNote() {
  const n = currentNote();
  if (!n) return;
  n.deletedAt = null;
  n.updatedAt = Date.now();
  saveLocal();
  closeModal();
  state.view = 'all';
  state.currentId = n.id;
  renderAll();
  scheduleSync();
  toast('已恢复');
}

function exportNote() {
  const n = currentNote();
  if (!n) return;
  const body = '# ' + (n.title || '无标题') + '\n\n' + (n.body || '') + '\n';
  const blob = new Blob([body], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ((n.title || 'untitled').replace(/[\\/:*?"<>|]/g, '-').slice(0, 80) || 'note') + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  closeModal();
  toast('已导出 Markdown');
}

function importFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let text = String(reader.result || '').replace(/\r\n?/g, '\n');
    let title = file.name.replace(/\.(md|markdown|txt)$/i, '');
    const h = text.match(/^#\s+(.+)\n/);
    if (h) { title = h[1].trim(); text = text.slice(h[0].length).replace(/^\n+/, ''); }
    const now = Date.now();
    const note = { id: uid(), title, body: text, tags: [], folder: viewFolder() || '', createdAt: now, updatedAt: now, favorite: false, pinned: false, deletedAt: null };
    state.notes.unshift(note);
    if (!viewFolder()) state.view = 'all';
    state.search = '';
    $('search').value = '';
    saveLocal();
    openNote(note.id);
    closeModal();
    scheduleSync();
    toast('已导入');
  };
  reader.readAsText(file);
}

/* ---------- rendering: list, chrome, title ---------- */
function renderList() {
  const list = filteredNotes();
  const host = $('list');
  const trashMode = state.view === 'trash';
  if (!list.length) {
    host.innerHTML = '<div class="list-empty">' + (state.search.trim() ? '没有匹配的笔记' : trashMode ? '回收站是空的' : '还没有笔记。<br>点右上角的 + 开始写。') + '</div>';
    return;
  }
  host.innerHTML = list.map((n) => {
    const t = (n.title || '').trim();
    return '<button class="note-item' + (n.id === state.currentId ? ' active' : '') + '" data-id="' + escapeHtml(n.id) + '"' + (n.deletedAt ? '' : ' draggable="true"') + '>' +
      '<span class="note-top"><span class="note-title">' + escapeHtml(t || '无标题') + '</span>' +
      (n.pinned && !n.deletedAt ? '<span class="note-pin"><svg viewBox="0 0 24 24"><path d="m14.5 3.5 6 6-3.2.8-3.9 3.9-.8 3.9-1.7-1.7L6 21l-1-1 4.7-4.8-1.7-1.7 3.9-.8 3.9-3.9Z"/></svg></span>' : '') +
      '</span>' +
      '<span class="note-excerpt">' + escapeHtml(noteExcerpt(n)) + '</span>' +
      '<span class="note-date">' + fmtDate(n.updatedAt) + (n.deletedAt ? ' · 已删除' : '') + (n.folder && !viewFolder() ? '<span class="note-folder">' + escapeHtml(n.folder) + '</span>' : '') + '</span>' +
      '</button>';
  }).join('');
  host.querySelectorAll('[data-id]').forEach((el) => {
    el.addEventListener('click', () => openNote(el.dataset.id));
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); openNote(el.dataset.id, false); openRowContextMenu(el.dataset.id, e.clientX, e.clientY); });

}

function updateListItem() {
  const n = currentNote();
  if (!n) return;
  const el = $('list').querySelector('[data-id="' + CSS.escape(n.id) + '"]');

function renderChrome() {

function renderAll() {

function setStatus(text) {
  $('status').textContent = text;
}

function hasPendingChanges() {
  const m = state.syncMeta;
  return m.deleted.length > 0 || state.notes.some((n) => m.stamps[n.id] == null || (n.updatedAt || 0) > m.stamps[n.id]);
}

function updateStatusMeta() {
  if (state.syncBusy) setStatus('同步中…');
  else if (state.syncError) setStatus('已保存在本机 · 同步失败');
  else if (state.connected && hasPendingChanges()) setStatus(state.syncInterval === -1 ? '已保存 · 未同步' : '已保存 · 等待同步');
  else if (state.lastSynced) setStatus('已同步 · ' + fmtDate(state.lastSynced));
  else setStatus('已保存在本机');
}

function growTitle() {
  titleEl.style.height = 'auto';
  titleEl.style.height = titleEl.scrollHeight + 'px';
}

function closeRowContextMenu() {
  if (contextDismissHandler) {
    document.removeEventListener('pointerdown', contextDismissHandler, true);
    contextDismissHandler = null;
  }
  const menu = $('row-context-menu');
  if (menu) menu.remove();
}

function openRowContextMenu(id, x, y) {
  const note = currentNote();
  if (!note || note.id !== id) return;
  closeRowContextMenu();
  const inTrash = !!note.deletedAt;
  const item = (action, label, danger) =>
    '<button type="button" data-context-action="' + action + '"' + (danger ? ' class="danger"' : '') + '>' + label + '</button>';
  const content = inTrash
    ? item('restore', '恢复笔记') + item('delete', '永久删除', true)
    : item('favorite', note.favorite ? '取消收藏' : '加入收藏') +
      item('pin', note.pinned ? '取消置顶' : '置顶笔记') +
      item('move', '移动到笔记本…') + item('export', '导出 Markdown') + '<hr>' + item('delete', '移到最近删除', true);
  const left = Math.max(8, Math.min(x, window.innerWidth - 216));
  const top = Math.max(8, Math.min(y, window.innerHeight - 210));
  const root = $('modal-root');
  root.innerHTML = '<div class="context-menu" id="row-context-menu" role="menu" style="left:' + left + 'px;top:' + top + 'px">' +
    '<div class="context-menu-title">' + escapeHtml(note.title || '无标题') + '</div>' + content + '</div>';
  const menu = $('row-context-menu');
  menu.querySelectorAll('[data-context-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.dataset.contextAction;
      closeRowContextMenu();
      if (action === 'favorite') toggleFavorite();
      if (action === 'pin') togglePin();
      if (action === 'export') exportNote();
      if (action === 'move') openMoveDialog(id);
      if (action === 'delete') trashNote();
      if (action === 'restore') restoreNote();
    });
  });
  contextDismissHandler = (event) => {
    if (!menu.contains(event.target)) closeRowContextMenu();
  };
  document.addEventListener('pointerdown', contextDismissHandler, true);
}
